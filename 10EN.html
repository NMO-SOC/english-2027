<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10EN Curriculum Plan 2027</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--line:#9aa5b1;--bg:#f7f7f5;--navy:#1d2b4f;--muted:#4a5562;--ph:#5b6570;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:16px;top:8px;z-index:5;background:#fff;color:var(--navy);padding:8px 12px;border:2px solid var(--navy);font-weight:bold}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
  header h1{text-align:center}
  .home{justify-self:start}
  h1{margin:0;background:var(--navy);color:#fff;padding:8px 18px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:0;outline-offset:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tools button,.btn{font:inherit;font-size:14px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tools button:hover,.btn:hover{border-color:var(--navy)}
  #save{background:var(--navy);color:#fff;border-color:var(--navy)}
  .home{gap:8px;font-weight:bold;color:var(--navy);border-color:var(--navy)}
  #status{font-size:14px;color:var(--muted)}
  #status:empty{display:none}
  .hint{font-size:14px;color:var(--muted);margin:0 auto 14px;max-width:80ch;text-align:center}
  @media (max-width:900px){header{grid-template-columns:1fr}header>*{justify-self:start}.tools{justify-content:flex-start}.hint{text-align:left;margin-left:0}}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  .grid:focus{outline:none}
  section,.overview{background:#fff;padding:10px;border:1px solid #ddd;border-top:5px solid var(--c);overflow-x:auto}
  h2{text-align:center;margin:4px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--c)}
  .dates{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;table-layout:fixed;font-size:13px}
  th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
  td{scroll-margin-top:60px}
  thead th{font-size:14px}
  thead th small{display:block;font-weight:normal;font-size:12px}
  .hol{display:block;font-size:11px;font-weight:normal}
  .tag{display:block;font-size:12px;font-weight:bold}
  .t1{--c:#2a5f9e;--l:#dce8f6}.t2{--c:#2e7d32;--l:#dcefdb}.t3{--c:#a8532a;--l:#f6e1d5}.t4{--c:#7e3f84;--l:#efdff0}
  .term thead th{background:var(--c);color:#fff}
  .term thead th.grey{background:#5f666d}
  td{background:var(--l)}
  td.grey{background:#e1e3e5;color:#4a5057}
  /* week topic leads the column */
  .wn{min-height:26px;font-family:var(--serif);font-size:14px;line-height:1.25;font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none;word-wrap:break-word}
  .wn:empty::before{content:"Notes / CAT";color:var(--ph);font-weight:normal}
  .wn.cat{font-family:var(--sans);line-height:1.3;background:var(--navy);color:#fff;border:none;border-radius:3px;padding:4px 5px;margin-bottom:6px;font-size:11.5px;cursor:pointer}
  .wn.cat:empty::before{content:none}
  .ck{display:block;font-size:10.5px;font-weight:normal;opacity:.9}
  .ct{display:block;font-size:12.5px}
  .les{margin-top:3px}
  .lh{cursor:pointer;background:rgba(0,0,0,.07);padding:5px 7px;font-weight:bold;border:1px solid var(--line);user-select:none;font-size:13px}
  .lh::before,.cch::before{content:"\25B8  ";content:"\25B8  " / ""}
  .les.open .lh::before,.ccw.open .cch::before{content:"\25BE  ";content:"\25BE  " / ""}
  .les.filled .lh{background:var(--c);color:#fff}
  td.grey .lh{background:#c3c6c9;color:#363b40}
  /* collapsible panels use hidden="until-found" so Ctrl+F can find and open them */
  .lb,.codes,.info{display:block}
  .lb[hidden],.codes[hidden],.info[hidden]{display:none}
  .uf .lb[hidden],.uf .codes[hidden],.uf .info[hidden]{display:block;min-height:0;padding:0;border:0;margin:0}
  .lb{min-height:50px;padding:4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word}
  .fl{font-size:11px;font-weight:bold;color:var(--muted);margin:6px 0 1px;display:flex;align-items:center;gap:6px}
  .cp{margin-left:auto;font:inherit;font-size:11px;font-weight:normal;min-height:24px;padding:2px 8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
  .cp:hover{border-color:var(--navy)}
  .cp.done{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fld{min-height:22px;padding:2px 4px;border-bottom:1px dotted #6b7680;outline:none;word-wrap:break-word;font-size:13px}
  .fld ul{margin:0;padding-left:16px}
  .fld li+li{margin-top:2px}
  .fld:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .fld:focus,.codes:focus{background:#fffbe6}
  .info{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 6px;margin:0 0 6px;font-size:13px;outline:none;word-wrap:break-word}
  .info:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .ccw{margin:0 0 4px}
  .cch{cursor:pointer;font-size:12px;font-weight:bold;color:#2d3748;background:rgba(0,0,0,.06);border:1px solid var(--line);padding:3px 7px;user-select:none}
  .codes{font-size:12px;color:#2d3748;padding:3px 4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word;outline:none}
  .codes:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  :focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .wn.cat:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
  .wn:focus,.info:focus{outline:2px solid var(--navy)}
  /* live site is read-only (body.ro): .ed = editing only, .rd = read-only only */
  body.ro .ed,body:not(.ro) .rd{display:none!important}
  body.ro .wn:empty::before,body.ro .fld:empty::before,body.ro .info:empty::before,body.ro .codes:empty::before{content:none}
  body.ro .ccw:has(.codes:empty){display:none}
  body.ro .info:empty{display:none!important}
  /* read-only: quiet lesson bars (solid "filled" colour only matters while editing) */
  body.ro .lh,body.ro .les.filled .lh{background:#fff;color:var(--ink);border-left:4px solid var(--c)}
  body.ro td.grey .lh{border-left-color:#5f666d}
  body.ro .wn.cat{padding:5px 6px}
  /* this week */
  th.now,td.now{box-shadow:inset 0 0 0 3px var(--navy)}
  th.now .tag{display:inline-block;background:var(--navy);border-radius:3px;padding:1px 6px;margin-top:3px}
  /* term jump links */
  .jump{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
  .jump a{color:#fff;background:var(--c);min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:14px}
  .jump a.nowlink{--c:var(--navy)}
  section{scroll-margin-top:60px}
  /* assessments at a glance (collapsible) */
  .overview{--c:var(--navy)}
  .overview summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0;border-radius:4px}
  .overview summary::-webkit-details-marker{display:none}
  .overview summary h2{margin:0;color:var(--navy)}
  .overview summary::before{content:"\25B8";content:"\25B8" / "";color:var(--navy);font-size:16px;transition:transform .15s}
  .overview[open] summary::before{transform:rotate(90deg)}
  .overview .count{font-size:13px;font-weight:bold;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px}
  .overview .more{font-size:13px;color:var(--muted)}
  .overview .more::after{content:"Show"}
  .overview[open] .more::after{content:"Hide"}
  .overview summary:hover h2{text-decoration:underline}
  .overview table{width:100%;table-layout:auto;margin-top:8px}
  .overview th{background:var(--navy);color:#fff;text-align:left;font-size:13px}
  .overview td{background:#fff;padding:6px}
  .overview td:first-child{white-space:nowrap}
  .overview td small{display:block;color:var(--muted)}
  .overview .ck{color:var(--muted);opacity:1}
  .overview a{color:var(--navy);font-weight:bold}
  /* plan search */
  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .search input{font:inherit;font-size:14px;min-height:36px;width:260px;padding:6px 10px;border:1px solid #6b7680;border-radius:4px;background:#fff}
  .search button{font:inherit;font-size:14px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
  #qcount{font-size:13px;color:var(--muted)}
  td.dim{opacity:.4}
  .hit{box-shadow:0 0 0 2px #e0a800}
  .hit.cur{box-shadow:0 0 0 3px var(--navy)}
  ::highlight(search){background:#ffe066;color:#1f2933}
  @media (prefers-reduced-motion:reduce){.overview summary::before{transition:none}}
  /* unit plan (Word) picker */
  .units{max-width:min(680px,calc(100vw - 32px));border:none;border-radius:8px;padding:20px 24px;color:var(--ink)}
  .units::backdrop{background:rgba(0,0,0,.45)}
  .units h2{margin:0 0 4px;color:var(--navy)}
  .units p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .units ul{list-style:none;margin:0 0 16px;padding:0}
  .units li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #e3e6ea}
  .units li span{flex:1}.units small{display:block;color:var(--muted)}
  /* bigger targets on touch screens */
  @media (pointer:coarse){.lh,.cch{min-height:40px;display:flex;align-items:center}.cp{min-height:36px;font-size:13px}.jump a,.tools button,.btn{min-height:44px}}
  /* phones: weeks stack vertically instead of scrolling sideways */
  @media (max-width:640px){
    body{padding:12px}
    .term table{display:flex;flex-direction:column;width:100%!important;min-width:0!important}
    .term thead,.term tbody,.term tr{display:contents}
    .term th{order:calc(var(--o) * 2 - 1);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;text-align:left;margin-top:10px}
    .term th small,.term th .hol,.term th .tag{display:inline}
    .term td{order:calc(var(--o) * 2);border-top:none}
    .overview td:first-child{white-space:normal}
    .search{margin-left:0;width:100%}.search input{flex:1;width:auto}
    section,td{scroll-margin-top:120px}
  }
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .tools,.hint,.jump,.home,.skip{display:none}
    header{grid-template-columns:1fr}
    th.now,td.now,.hit{box-shadow:none}
    td.dim{opacity:1}
    .overview .more,.overview summary::before{display:none}
    .grid{gap:8px}
    section,.overview{border:none;border-top:4px solid var(--c)}
    section+section{break-before:page}
    .lb,.lb[hidden]{display:block!important;content-visibility:visible!important;min-height:30px!important;padding:4px!important;border:1px solid var(--line)!important;border-top:none!important}
    .lh::before,.cch::before,.wn:empty::before,.fld:empty::before{content:""}
    .cp{display:none}
    .codes:not(:empty),.wn.cat + .info:not(:empty){display:block!important;content-visibility:visible!important;padding:3px 4px!important;border:1px solid var(--line)!important;margin:0 0 4px!important}
    .ccw:has(.codes:empty){display:none}
    .fld ul{padding:0;list-style:none}.fld li{display:inline}.fld li+li::before{content:" | "}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* "Print CATs and topics": weekly topics and CATs only */
    body.summary .les,body.summary .ccw{display:none!important}
    body.summary .wn{border-bottom:none}
  }
</style>
</head>

];
const DEFAULTS={};
const SAVED={"1--1":"Creative Writing: Introduction and Mentor Texts","codes-1--1":"VC2E10LE05, VC2E10LE02, VC2E10LY07","1-1-1-dn":"Write one thing you hope to learn in English this year.","1-1-1-li":"We will be introduced to Year 10 English and its assessment tasks.","1-1-1-sc":"I can state the aims of the course. | I can name the assessment tasks for the year. | I can explain how I will be assessed.","1-1-2-dn":"Write the first line of a story you remember.","1-1-2-li":"We will read mentor texts and identify what makes creative writing engaging.","1-1-2-sc":"I can summarise a mentor text. | I can identify one technique that engages the reader. | I can give my personal response.","1-1-3-dn":"Write one sentence in the voice of an angry character.","1-1-3-li":"We will analyse how writers create voice in mentor texts.","1-1-3-sc":"I can define voice. | I can identify voice in a mentor text. | I can explain how voice creates an emotional response.","1-1-4-dn":"List three moments that would make a good story.","1-1-4-li":"We will brainstorm ideas for our own creative writing.","1-1-4-sc":"I can generate at least five ideas. | I can choose an idea with strong potential. | I can explain why I chose it.","1--2":"Creative Writing: Character, Setting and Voice","codes-1--2":"VC2E10LE06, VC2E10LE05, VC2E10LA08","1-2-1-dn":"Write one sentence that shows a character is nervous without saying it.","1-2-1-li":"We will create a convincing character.","1-2-1-sc":"I can describe a character's appearance, thoughts and actions. | I can show character rather than tell. | I can give my character a clear motivation.","1-2-2-dn":"Write one sentence describing a place using only sound.","1-2-2-li":"We will create a vivid setting using sensory language.","1-2-2-sc":"I can use at least three senses. | I can use figurative language. | I can show atmosphere through setting.","1-2-3-dn":"Rewrite a sentence from first to third person.","1-2-3-li":"We will develop a sustained narrative voice.","1-2-3-sc":"I can choose first or third person for effect. | I can keep my voice consistent. | I can explain the effect of my choice.","1-2-4-dn":"Write three stronger words for 'walked'.","1-2-4-li":"We will choose precise vocabulary to create mood and tone.","1-2-4-sc":"I can replace weak words with precise ones. | I can explain how vocabulary creates tone. | I can create a clear mood in a paragraph.","1--3":"Creative Writing: Structure and Language","codes-1--3":"VC2E10LE06, VC2E10LA05, VC2E10LA04","1-3-1-dn":"Write the beginning, middle and end of a story in three words.","1-3-1-li":"We will explore different narrative structures.","1-3-1-sc":"I can describe linear and non-linear structures. | I can identify a structure in a mentor text. | I can choose a structure for my piece.","1-3-2-dn":"Write one opening line that starts in the middle of the action.","1-3-2-li":"We will craft an engaging opening.","1-3-2-sc":"I can identify different types of openings. | I can explain the effect of each. | I can write my own opening.","1-3-3-dn":"Write one sentence fragment that creates suspense.","1-3-3-li":"We will vary sentence structures for effect.","1-3-3-sc":"I can use short sentences for tension. | I can use complex sentences for detail. | I can explain the effect of my choices.","1-3-4-dn":"Write the final sentence of a story you know.","1-3-4-li":"We will craft an effective ending.","1-3-4-sc":"I can identify different types of endings. | I can write an ending that links to my opening. | I can leave the reader with a final idea.","1--4":"Creative Writing: Drafting and Feedback","codes-1--4":"VC2E10LE06, VC2E10LY09, VC2E10LA09","1-4-1-dn":"Write your story idea in one sentence.","1-4-1-li":"We will plan our creative piece for CAT 1.","1-4-1-sc":"I can plan my structure. | I can list the techniques I will use. | I can explain my purpose and audience.","1-4-2-dn":"Write your first sentence.","1-4-2-li":"We will draft our creative piece.","1-4-2-sc":"I can write an engaging opening. | I can develop character and setting. | I can sustain my voice.","1-4-3-dn":"Write one question you want your partner to answer about your draft.","1-4-3-li":"We will give and receive feedback on our drafts.","1-4-3-sc":"I can give specific feedback using the criteria. | I can discuss my choices with a partner. | I can note changes to make.","1-4-4-dn":"Find one sentence in your draft to improve.","1-4-4-li":"We will edit our drafts for control and coherence.","1-4-4-sc":"I can improve my sentence structure. | I can use punctuation for effect. | I can check spelling and paragraphing.","1--5":"S1_10EN_CAT1: Creative Writing","codes-1--5":"VC2E10LE06, VC2E10LY09, VC2E10LA05","info-1--5":"CAT 1: Students write an original creative piece with a sustained voice, using the structures and language features studied. Curriculum codes: VC2E10LE06, VC2E10LY09, VC2E10LA05.","1-5-1-dn":"Write one goal for your CAT piece.","1-5-1-li":"We will prepare to complete CAT 1.","1-5-1-sc":"I can review my plan and feedback. | I can explain the CAT instructions. | I can set a goal for my writing.","1-5-2-dn":"Take two minutes to review your plan.","1-5-2-li":"We will complete our creative piece for CAT 1.","1-5-2-sc":"I can write with a sustained voice. | I can use the structures and techniques studied. | I can create a clear mood.","1-5-3-dn":"Read your last paragraph and check it makes sense.","1-5-3-li":"We will complete our creative piece for CAT 1.","1-5-3-sc":"I can write with a sustained voice. | I can use the structures and techniques studied. | I can edit my work.","1-5-4-dn":"Choose one sentence from your piece to share.","1-5-4-li":"We will share our writing and reflect on our process.","1-5-4-sc":"I can share part of my piece. | I can give respectful feedback. | I can reflect on what I learnt.","1--6":"Film Study: Introduction and Context (film to be decided)","codes-1--6":"VC2E10LY04, VC2E10LE01, VC2E10LY07","1-6-1-dn":"Write one film you have seen that made you think.","1-6-1-li":"We will be introduced to the film study and our next assessment.","1-6-1-sc":"I can name the film and its director. | I can explain what an analytical text response essay is. | I can state when the CAT is due.","1-6-2-dn":"Write one thing you already know about the film's setting.","1-6-2-li":"We will research the context of the film.","1-6-2-sc":"I can identify when and where the film was made. | I can describe its historical and social context. | I can record my sources.","1-6-3-dn":"Share one context fact with a partner.","1-6-3-li":"We will explore how the film reflects its context.","1-6-3-sc":"I can link one context point to the film. | I can explain how context shapes the story. | I can summarise context in my own words.","1-6-4-dn":"Predict one conflict the film might explore.","1-6-4-li":"We will predict the ideas the film will explore.","1-6-4-sc":"I can make a prediction using context. | I can identify a possible theme. | I can record a question I have.","1--7":"Film Language: CAMELS+D","codes-1--7":"VC2E10LA07, VC2E10LE04, VC2E10LY01","1-7-1-dn":"Name one thing you notice first about a film's opening.","1-7-1-li":"We will revise the elements of CAMELS+D.","1-7-1-sc":"I can name each CAMELS+D element. | I can explain what each element means. | I can identify one element in a film clip.","1-7-2-dn":"Describe how a close-up might make the viewer feel.","1-7-2-li":"We will evaluate how camera and editing shape representation.","1-7-2-sc":"I can identify camera shots, angles and movement. | I can explain how editing controls pace. | I can evaluate the effect on the viewer.","1-7-3-dn":"Write one sentence describing the mood of a film clip.","1-7-3-li":"We will evaluate how sound, lighting and mise-en-scène create meaning.","1-7-3-sc":"I can identify diegetic and non-diegetic sound. | I can explain how lighting creates mood. | I can evaluate how setting and costume represent characters.","1-7-4-dn":"Watch 60 seconds of a clip and note one camera choice.","1-7-4-li":"We will discuss how a film clip positions its audience.","1-7-4-sc":"I can share my view of a clip. | I can support it with CAMELS+D evidence. | I can respond to other views.","1--8":"Viewing the Film","codes-1--8":"VC2E10LA07, VC2E10LE02, VC2E10LY07","1-8-1-dn":"Predict what the main character wants.","1-8-1-li":"We will watch the opening of the film and analyse how it introduces the main characters.","1-8-1-sc":"I can describe what happens in the opening. | I can identify one CAMELS+D element. | I can explain how the opening establishes mood.","1-8-2-dn":"Write one word that describes the main character so far.","1-8-2-li":"We will watch the film and track the main character's journey.","1-8-2-sc":"I can note key moments. | I can describe how the character changes. | I can record evidence for each moment.","1-8-3-dn":"Write one question you have about the film so far.","1-8-3-li":"We will watch the film and analyse how conflict develops.","1-8-3-sc":"I can identify the main conflict. | I can explain how tension builds. | I can identify one technique that builds tension.","1-8-4-dn":"Write one scene that stood out to you and why.","1-8-4-li":"We will record our first impressions of the film.","1-8-4-sc":"I can summarise what has happened so far. | I can record my first impressions of the characters. | I can identify a scene to analyse.","1--9":"Viewing the Film (continued)","codes-1--9":"VC2E10LE02, VC2E10LA07, VC2E10LY04","1-9-1-dn":"Predict how the film will end.","1-9-1-li":"We will watch the film and analyse the climax.","1-9-1-sc":"I can describe what happens at the climax. | I can explain how techniques create tension. | I can explain what the climax reveals.","1-9-2-dn":"Write one word that describes how the film ended.","1-9-2-li":"We will watch the ending of the film and analyse how it resolves the conflict.","1-9-2-sc":"I can describe the resolution. | I can explain what the ending suggests. | I can identify one technique in the final scene.","1-9-3-dn":"Write one sentence about how your view of a character has changed.","1-9-3-li":"We will compare our first and final impressions of the film.","1-9-3-sc":"I can compare my first impression with my view now. | I can explain what changed my view. | I can name the scene that affected me most.","1-9-4-dn":"Write the main message of the film in one sentence.","1-9-4-li":"We will discuss our interpretations of the film.","1-9-4-sc":"I can share my interpretation. | I can explore the interpretations of others. | I can support my view with evidence.","2--1":"Film Study: Characters","codes-2--1":"VC2E10LE01, VC2E10LY04, VC2E10LA07","2-1-1-dn":"Write three words that describe the main character.","2-1-1-li":"We will analyse how the main character is represented in the film.","2-1-1-sc":"I can describe the main character's key qualities. | I can find evidence for each quality. | I can explain how the director shapes our view of them.","2-1-2-dn":"Name the supporting character who matters most and say why.","2-1-2-li":"We will analyse how supporting characters are represented.","2-1-2-sc":"I can describe the role of each supporting character. | I can explain how each helps or challenges the main character. | I can find evidence for one character.","2-1-3-dn":"Write one way a character is different at the end of the film.","2-1-3-li":"We will analyse how characters change across the film.","2-1-3-sc":"I can describe how a character changes. | I can identify the scene where the change happens. | I can explain what causes it.","2-1-4-dn":"Write one way a character reflects the time and place of the film.","2-1-4-li":"We will analyse how characters reflect the film's context.","2-1-4-sc":"I can link a character to the film's context. | I can explain how they represent a group or idea. | I can support my view with evidence.","2--2":"Film Study: Themes and Positions","codes-2--2":"VC2E10LE03, VC2E10LY05, VC2E10LE02","2-2-1-dn":"Write one idea the film wants the audience to think about.","2-2-1-li":"We will analyse the themes of the film.","2-2-1-sc":"I can identify the main themes. | I can explain how each is developed. | I can find evidence for each theme.","2-2-2-dn":"Write one moral question the film raises.","2-2-2-li":"We will analyse the social, moral or ethical positions the film presents.","2-2-2-sc":"I can identify a position the film takes. | I can explain how techniques shape our view of it. | I can evaluate whether I agree.","2-2-3-dn":"Write one value the film seems to support.","2-2-3-li":"We will analyse how the film represents values and beliefs.","2-2-3-sc":"I can identify a value the film endorses or criticises. | I can explain how techniques show it. | I can find evidence for it.","2-2-4-dn":"Write the main message of the film in one sentence.","2-2-4-li":"We will synthesise our own interpretation of the film.","2-2-4-sc":"I can state my interpretation. | I can support it with evidence. | I can explain how others might see it differently.","2--3":"Film Study: Techniques and Meaning","codes-2--3":"VC2E10LA07, VC2E10LE04, VC2E10LA03","2-3-1-dn":"Name one scene from the film that stayed with you.","2-3-1-li":"We will analyse a key scene from the film using CAMELS+D.","2-3-1-sc":"I can identify at least three CAMELS+D elements in the scene. | I can explain what each element shows. | I can link the elements to meaning.","2-3-2-dn":"Describe the music in one scene using one adjective.","2-3-2-li":"We will evaluate how sound and music shape the audience's response.","2-3-2-sc":"I can identify diegetic and non-diegetic sound in a scene. | I can explain how music creates mood. | I can evaluate its effect on the audience.","2-3-3-dn":"Write one object in the film that seems to mean more than itself.","2-3-3-li":"We will analyse how symbols and motifs create meaning in the film.","2-3-3-sc":"I can identify a symbol or motif. | I can explain what it represents. | I can track where it appears.","2-3-4-dn":"Match one technique to one theme.","2-3-4-li":"We will link film techniques to characters and themes.","2-3-4-sc":"I can choose a technique for each theme. | I can explain how the technique supports the theme. | I can collect evidence for my essay.","2--4":"Film Study: Analytical Essay Structure","codes-2--4":"VC2E10LY06, VC2E10LA04, VC2E10LA03","2-4-1-dn":"Write one sentence introducing the film, its director and its form.","2-4-1-li":"We will learn how to structure the introduction of an analytical essay.","2-4-1-sc":"I can introduce the text, director and form. | I can state a clear contention. | I can foreshadow three body paragraphs.","2-4-2-dn":"Write a 'What' sentence for one argument.","2-4-2-li":"We will learn how to structure body paragraphs using What, How and Why.","2-4-2-sc":"I can state what the argument is. | I can explain how a film technique shows it. | I can explain why it matters to the contention.","2-4-3-dn":"Rewrite a contention as a conclusion sentence.","2-4-3-li":"We will learn how to write a conclusion that restates and extends our contention.","2-4-3-sc":"I can restate the contention in new words. | I can summarise the three arguments. | I can end with a final insight.","2-4-4-dn":"Label the parts of one model paragraph.","2-4-4-li":"We will analyse a model essay on the film.","2-4-4-sc":"I can identify the introduction, body and conclusion. | I can label the What, How and Why in one paragraph. | I can explain how linking words connect ideas.","2--5":"Practice: Film Analytical Essay","codes-2--5":"VC2E10LY06, VC2E10LY09, VC2E10LA09","2-5-1-dn":"Underline the key words in a sample prompt.","2-5-1-li":"We will unpack a prompt and plan an essay on the film.","2-5-1-sc":"I can identify the key words in a prompt. | I can write a contention that answers it. | I can plan three arguments with evidence.","2-5-2-dn":"Write the first sentence of your practice essay.","2-5-2-li":"We will write a practice essay under timed conditions.","2-5-2-sc":"I can write a complete introduction, body and conclusion. | I can use evidence from the film. | I can manage my time.","2-5-3-dn":"Write one question you want your partner to answer about your essay.","2-5-3-li":"We will give and receive feedback on our practice essays.","2-5-3-sc":"I can give specific feedback using the criteria. | I can identify strengths and areas to improve. | I can note changes to make.","2-5-4-dn":"Read your introduction and mark one sentence to improve.","2-5-4-li":"We will review and edit our practice essay.","2-5-4-sc":"I can check my work against the criteria. | I can improve one paragraph. | I can set a goal for the CAT.","2--6":"S1_10EN_CAT2: Film Text Response","codes-2--6":"VC2E10LE04, VC2E10LA07, VC2E10LY06","info-2--6":"CAT 2: An analytical text response essay on the film studied (film to be decided). Curriculum codes: VC2E10LE04, VC2E10LA07, VC2E10LY06.","2-6-1-dn":"Write one goal for your CAT essay.","2-6-1-li":"We will prepare for CAT 2 by reviewing our feedback.","2-6-1-sc":"I can name one thing to improve from my practice essay. | I can review my evidence. | I can explain the CAT instructions.","2-6-2-dn":"Take two minutes to read the prompts and choose one.","2-6-2-li":"We will write an analytical text response essay on the film for CAT 2.","2-6-2-sc":"I can write a clear contention. | I can use evidence from the film. | I can explain how film techniques shape interpretation.","2-6-3-dn":"Take two minutes to review your plan.","2-6-3-li":"We will write an analytical text response essay on the film for CAT 2.","2-6-3-sc":"I can write a clear contention. | I can use evidence from the film. | I can explain how film techniques shape interpretation.","2-6-4-dn":"Write one thing you found easy and one you found hard in the CAT.","2-6-4-li":"We will reflect on our writing and set goals for the exam.","2-6-4-sc":"I can identify one strength in my essay. | I can name one thing to improve. | I can set a goal for the exam.","2--7":"Exam Revision: se revision.","2-8-4-sc":"I can check my work against the criteria. | I can identify one area to improve. | I can name what I need to revise.","2--9":"EXAM: Semester 1 English Exam","info-2--9":"EXAM: Semester 1 English exam. Sections to be confirmed.","2--10":"Debate and Oral Presentation: Introduction","codes-2--10":"VC2E10LY01, VC2E10LY05, VC2E10LA01","2-10-1-dn":"Name one speech you have heard that changed someone's mind.","2-10-1-li":"We will be introduced to the debate and oral presentation unit.","2-10-1-sc":"I can explain the difference between a debate and an oral presentation. | I can name the CAT task. | I can state when the CAT is due.","2-10-2-dn":"Write one thing that makes a speaker convincing.","2-10-2-li":"We will analyse a model persuasive speech.","2-10-2-sc":"I can identify the speaker's contention. | I can identify the audience and purpose. | I can explain one technique the speaker uses.","2-10-3-dn":"Write one topic you would like to debate.","2-10-3-li":"We will watch a model debate and identify how it works.","2-10-3-sc":"I can identify the affirmative and negative teams. | I can explain how each speaker contributes. | I can identify one strong rebuttal.","2-10-4-dn":"List three issues people your age care about.","2-10-4-li":"We will brainstorm issues for our debate or oral presentation.","2-10-4-sc":"I can list at least five issues. | I can choose one I care about. | I can explain why it matters to an audience.","2--11":"Debate and Oral Presentation Skills","codes-2--11":"VC2E10LY02, VC2E10LY01, VC2E10LA01","2-11-1-dn":"Write one rule you think a debate should have.","2-11-1-li":"We will learn the structure and roles of a formal debate.","2-11-1-sc":"I can explain the roles of each speaker. | I can explain how a debate is judged. | I can identify a strong argument.","2-11-2-dn":"Write one argument and one rebuttal on a school issue.","2-11-2-li":"We will learn how to build and rebut arguments.","2-11-2-sc":"I can write an argument with evidence. | I can predict the other side's arguments. | I can write a rebuttal.","2-11-3-dn":"Name one presentation you have watched and what made it engaging.","2-11-3-li":"We will learn the structure of an oral presentation.","2-11-3-sc":"I can write an engaging opening. | I can organise my ideas clearly. | I can write a strong conclusion.","2-11-4-dn":"Read one sentence aloud three ways and choose the most persuasive.","2-11-4-li":"We will practise features of voice and body language.","2-11-4-sc":"I can use volume, pace and pause for effect. | I can make eye contact. | I can use formal language for my audience.","3--1":"Persuasive Language in Speeches","codes-3--1":"VC2E10LY05, VC2E10LA02, VC2E10LA08","3-1-1-dn":"Find one rhetorical question in a speech extract.","3-1-1-li":"We will identify persuasive techniques in speeches.","3-1-1-sc":"I can name common persuasive techniques. | I can identify them in a speech. | I can explain the purpose of each.","3-1-2-dn":"Write one word that shows a speaker's attitude.","3-1-2-li":"We will analyse how language reveals a speaker's views and values.","3-1-2-sc":"I can identify evaluative language. | I can explain what it reveals. | I can find an example in a speech.","3-1-3-dn":"Write three stronger words for 'bad'.","3-1-3-li":"We will choose precise vocabulary for our audience.","3-1-3-sc":"I can choose words that suit my audience. | I can replace weak words with precise ones. | I can explain the effect of my choices.","3-1-4-dn":"Write one sentence using inclusive language.","3-1-4-li":"We will use persuasive techniques in our own speech.","3-1-4-sc":"I can use at least three techniques. | I can match each technique to my purpose. | I can read my paragraph aloud and check it persuades.","3--2":"Preparing the Debate or Oral Presentation","codes-3--2":"VC2E10LY08, VC2E10LY02, VC2E10LY09","3-2-1-dn":"Write your topic in one sentence.","3-2-1-li":"We will choose our topic and format for CAT 1.","3-2-1-sc":"I can choose a debate or presentation. | I can choose an issue. | I can state my contention.","3-2-2-dn":"Write one fact that supports your view.","3-2-2-li":"We will research and plan our arguments.","3-2-2-sc":"I can plan my arguments. | I can find evidence to support them. | I can prepare rebuttals or audience questions.","3-2-3-dn":"Write your opening line.","3-2-3-li":"We will write our speech and prepare cue cards.","3-2-3-sc":"I can write a clear speech. | I can prepare cue cards. | I can include multimodal elements if needed.","3-2-4-dn":"Write one thing you will focus on when you present.","3-2-4-li":"We will rehearse and give feedback to others.","3-2-4-sc":"I can rehearse within the time limit. | I can give specific feedback using the criteria. | I can use feedback to improve.","3--3":"S2_10EN_CAT1: Debate or Oral Presentation","codes-3--3":"VC2E10LY02, VC2E10LY08, VC2E10LY05","info-3--3":"CAT 1: Students take part in a debate or deliver an oral presentation on an issue. Curriculum codes: VC2E10LY02, VC2E10LY08, VC2E10LY05.","3-3-1-dn":"Write the first sentence of your speech from memory.","3-3-1-li":"We will complete a final rehearsal for CAT 1.","3-3-1-sc":"I can present within the time limit. | I can use my cue cards without reading from them. | I can check my work against the criteria.","3-3-2-dn":"Take one minute to review your cue cards.","3-3-2-li":"We will deliver our debate or oral presentation for CAT 1.","3-3-2-sc":"I can present a clear contention. | I can support my view with evidence. | I can use features of voice.","3-3-3-dn":"Take one minute to review your cue cards.","3-3-3-li":"We will deliver our debate or oral presentation for CAT 1.","3-3-3-sc":"I can present a clear contention. | I can support my view with evidence. | I can use features of voice.","3-3-4-dn":"Write one thing you did well when you presented.","3-3-4-li":"We will finish CAT 1 and reflect on our speaking skills.","3-3-4-sc":"I can identify one strength in my presentation. | I can name one th document.querySelectorAll("[data-k]").forEach(el=>{

// Open/close panels. Closed panels are hidden="until-found", so the browser's Find can open them.
if("onbeforematch" in document.body)document.documentElement.classList.add("uf");

  (btn.classList.contains("wn")?btn:btn.parentElement).classList.toggle("open",open);
  if(btn.hasAttribute("aria-expanded"))btn.setAttribute("aria-expanded",open);
  panel.hidden=open?false:"until-found";

const keyClick=b=>b.addEventListener("keydown",e=>{if(e.target===b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();b.click();}});
document.querySelectorAll(".lh,.cch").forEach(b=>{
  const p=b.nextElementSibling;

// Copy buttons: copy a lesson's learning intention, success criteria or Do Now as plain text. Read-only: works on the live site too.
const flash=(b,msg)=>{b.textContent=msg;b.classList.add("done");setTimeout(()=>{b.textContent="Copy";b.classList.remove("done");},1500);};
grid.addEventListener("click",async e=>{
  const b=e.target.closest(".cp");if(!b)return;
  const f=b.parentElement.nextElementSibling, isSC=f.dataset.k.endsWith("-sc");
  // success criteria become a bulleted list, one per line; the others copy as written
  const text=isSC?f.innerText.split(/\s*\|\s*|\n/).map(s=>s.trim()).filter(Boolean).map(s=>"• "+s).join("\n"):f.innerText.trim();
  if(!text)return flash(b,"Nothing to copy");
  try{await navigator.clipboard.writeText(text);}
  catch(err){ // fallback for browsers or pages where the clipboard API is blocked
    const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();
    if(!ok)return flash(b,"Copy failed");
  }
  flash(b,"Copied");
});

  function open(b,p){if(p.hidden){setOpen(b,p,true);opened.push([b,p]);}}
  function run(){
    clear();
    const term=q.value.trim().toLowerCase();
    if(term.length<2)return;
    const ranges=[];let weeks=0;
    document.querySelectorAll(".term td").forEach(td=>{
      let found=false;
      td.querySelectorAll(".wn,.info,.codes,.lh,.fld").forEach(el=>{
        if(!el.textContent.toLowerCase().includes(term))return;
        found=true;
        const les=el.closest(".les");
        if(les){const b=les.querySelector(".lh");open(b,b.nextElementSibling);}
        else if(el.classList.contains("codes"))open(el.previousElementSibling,el);
        else if(el.classList.contains("info")&&el.previousElementSibling.classList.contains("cat"))open(el.previousElementSibling,el);
        const box=les||el;if(!hits.includes(box)){hits.push(box);box.classList.add("hit");}
        if(HL){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
          while((n=tw.nextNode())){const s=n.data.toLowerCase();let i=s.indexOf(term);
            while(i>-1){const r=new Range();r.setStart(n,i);r.setEnd(n,i+term.length);ranges.push(r);i=s.indexOf(term,i+term.length);}}}
      });
      if(found)weeks++;else td.classList.add("dim");
    });
    if(HL&&ranges.length)CSS.highlights.set("search",new Highlight(...ranges));
    cnt.textContent=hits.length?`${hits.length} match${hits.length>1?"es":""} in ${weeks} week${weeks>1?"s":""}`:"No matches. Check the spelling or try a shorter word.";
    next.hidden=!hits.length;
  }
  function go(){
    if(!hits.length)return;
    if(cur>-1)hits[cur].classList.remove("cur");
    cur=(cur+1)%hits.length;hits[cur].classList.add("cur");
    hits[cur].scrollIntoView({block:"center",inline:"center"});
    if(hits.length>1)cnt.textContent=`Match ${cur+1} of ${hits.length}`;
  }
  q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,150);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);if(!hits.length)run();go();}if(e.key==="Escape"){q.value="";clear();}});
  next.addEventListener("click",go);
})();

// Build the file text: original page with the current entries written into SAVED
function fileText(){
  const c=document.documentElement.cloneNode(true);
  c.removeAttribute("class");
  c.querySelector("#grid").innerHTML="";
  c.querySelector("#status").textContent="";
  // \u2028/\u2029 would break the line match below and "<" could end the script early; escaping keeps the data identical
  const data=JSON.stringify(store).replace(/[<\u2028\u2029]/g,ch=>"\\u"+ch.charCodeAt(0).toString(16).padStart(4,"0"));
  const html="<!doctype html>\n"+c.outerHTML;
  let found=false;
  const out=html.replace(/const SAVED=.*;\n/, ()=>{found=true;return "const SAVED="+data+";\n";});
  if(!found)throw new Error("SAVED line not found");
  return out;
}
async function save(){
  if(LIVE)return;
  let text;
  try{text=fileText();}catch(e){setStatus("Not saved: this file's data line is missing. Your changes are still on screen.");return;}
  if(window.showSaveFilePicker){
    try{
      if(!handle)handle=await window.showSaveFilePicker({suggestedName:document.title+".html",
        types:[{description:"HTML file",accept:{"text/html":[".html"]}}]});
      const w=await handle.createWritable();
      await w.write(text);
      await w.close();
      dirty=false;
      setStatus("Saved at "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}));
      return;
    }catch(e){
      if(e.name==="AbortError")return;
      handle=null;
    }
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/html"}));
  a.download=document.title+".html";
  a.click();
  dirty=false;

}

function units(){
  const out=[];let cur=[];
  TERMS.forEach(t=>{for(let w=1;w<=t.weeks;w++){
    if((t.noLessons||[]).includes(w)&&!(t.exam||[]).includes(w))continue; // Set-Up, Step-Up and so on

// Minimal zip (stored, no compression): all a .docx needs
function zip(files){
  const enc=new TextEncoder(),local=[],central=[];let off=0;
  const T=[...Array(256)].map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0;});
  const le=(...f)=>{const b=new Uint8Array(f.reduce((s,x)=>s+x[1],0)),v=new DataView(b.buffer);let i=0;for(const [x,n] of f){n===2?v.setUint16(i,x,true):v.setUint32(i,x,true);i+=n;}return b;};
  for(const [name,text] of Object.entries(files)){
    const nm=enc.encode(name),d=enc.encode(text);let c=~0;for(const b of d)c=T[(c^b)&255]^(c>>>8);c=~c>>>0;
    const common=[[20,2],[0,2],[0,2],[0,2],[33,2],[c,4],[d.length,4],[d.length,4],[nm.length,2],[0,2]];
    local.push(le([0x04034b50,4],...common),nm,d);
    central.push(le([0x02014b50,4],[20,2],...common,[0,2],[0,2],[0,2],[0,4],[off,4]),nm);
    off+=30+nm.length+d.length;
  }
  const size=central.reduce((s,b)=>s+b.length,0), n=Object.keys(files).length;
  return new Blob([...local,...central,le([0x06054b50,4],[0,2],[0,2],[n,2],[n,2],[size,4],[off,4],[0,2])],{type:CT_DOCX});
}

    if(f("li"))lis.push(f("li"));
    f("sc").split(/\s*\|\s*/).filter(Boolean).forEach(s=>scs.push(s));
    if(f("dn"))dns.push(f("dn"));
    if(f("title"))titles.push(f("title"));
    if(!firstDn&&f("dn"))firstDn=f("dn");
  }));
  const uniq=a=>[...new Set(a)];
  const liU=uniq(lis), scU=uniq(scs);
  const cat=weeks[weeks.length-1];
  const UNIT_TEXT=[name,...topics,...titles,...liU,...scU].join(" ");
  const SUBS=[
    [/film|viewing|camels/i,"Analysing film","film language and camera techniques"],
    [/oral|present|debate|speech|rehears/i,"Speaking and presenting","spoken language and presentation"],
    [/memoir|creative|narrative|crafting|personal text/i,"Creating texts","creative and personal language"],
    [/grammar|conventions|punctuation|sentence/i,"Language conventions","language conventions and sentence structure"],
    [/macbeth|romeo|shakespeare|early modern/i,"Shakespearean drama","Shakespearean language and dramatic structure"],
    [/persua|argu|contention|analys|essay/i,"Analysing argument and texts","persuasive and analytical language"],
    [/animal farm|allegory|novel|fable/i,"Analysing novels","narrative voice and symbolism"]];
  const subHits=SUBS.filter(([re])=>re.test(UNIT_TEXT));
  const sub=subHits.length?[...new Set(subHits.map(x=>x[1]))].slice(0,2).join(", "):"Reading and responding to texts";
  const focusPhrase=subHits.length?subHits[0][2]:"text structure and language features";
  const opt=(re,yes)=>re.test(UNIT_TEXT)?yes:"";
  const adj={
    eal:`Pre-teach the key terms for ${(subHits.length?subHits[0][1]:"this unit").toLowerCase()} with a word bank and visual glossary. Give sentence starters for each learning intention. Students plan the CAT in dot points before drafting.`+opt(/oral|present|debate|speech/i," Record a practice run so students hear the model before they speak."),
    int:`Break each lesson into numbered steps with a visual organiser. Give annotated copies of the texts with key quotes highlighted. For the CAT, allow extra time, a dictated or recorded response and a shorter word target.`+opt(/film|viewing|camels/i," Re-watch film clips in short sections, with a CAMELS+D checklist."),
    ext:`Students write their own analytical question about the unit and test it against the success criteria. Add a comparison with a second text, or a counter-argument, to the CAT.`+opt(/oral|present|debate/i," Students answer audience questions after their presentation.")+opt(/film|viewing/i," Students compare two film clips using CAMELS+D.")
  };
  const std9=`By the end of Level 9, students analyse how ${focusPhrase} shape meaning for an audience. They use evidence from the text to support their interpretation and organise their ideas in clear, structured responses.`;
  const std10=`By the end of Level 10, students evaluate how ${focusPhrase} position the audience and shape meaning. They sustain a clear interpretation or argument using precise, selected evidence, and adapt language and structure to purpose and audience.`;
  const formText=`Checked in every lesson against the success criteria, with the Do Now as an entry check (Weeks 1–${weeks.length}).`;
  const catInfo=(store["info-"+cat.k]||"").trim();
  const strandCounts={};
  codes.forEach(c=>{const mm=c.match(/^VC2E\d+(LA|LE|LY)/); if(mm) strandCounts[mm[1]]=(strandCounts[mm[1]]||0)+1;});
  const STRAND={LA:"Language",LE:"Literature",LY:"Literacy"};
  const top=Object.entries(strandCounts).sort((a,b)=>b[1]-a[1])[0];
  const strand=top?STRAND[top[0]]:"to be added";
  const corpus=[name,...topics,...liU,...scU,...dns,...titles,catInfo].join(" ").toLowerCase();
  const tick=(on,label)=>para((on?"☒ ":"☐ ")+label);
  const cross=UP2_CROSS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const caps=UP2_CAPS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const cld=UP2_CLD.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const firstWeek=weeks[0];
  const preText=firstDn?`Week 1 Do Now (diagnostic): ${firstDn}`:`Diagnostic at the start of the unit: students write what they already know about "${topics[0]||name}" and one question they have.`;
  const catText=para(cat.topic||"To be added",{b:1})+(catInfo?bullets(catInfo.split("\n").filter(s=>s.trim()).map(s=>s.trim())):"");
  const W=[1421,1421,1421,2549,6045];

  const sec1=table([2850,5110,5110],[
    tr([cell(13070,{span:3,fill:"FFC0E3",body:para("Adjustments/ Scaffolds",{b:1})})]),
    tr([cell(2850,{body:para("EAL",{b:1})}),cell(5110,{body:para("Integration",{b:1})}),cell(5110,{body:para("Extension",{b:1})})]),
    tr([cell(2850,{body:para(adj.eal)}),cell(5110,{body:para(adj.int)}),cell(5110,{body:para(adj.ext)})])]);
  const sec2=table([6229,6821],[
    tr([cell(13050,{span:2,fill:"D9D9D9",body:para("Mapping to F–10 Victorian Curriculum 2.0",{b:1})})]),
    tr([cell(13050,{span:2,body:para("Content description: "+(codes.join(", ")||"to be added"))})]),
    tr([cell(13050,{span:2,fill:"D1E8B2",body:para("Achievement standard",{b:1})})]),
    tr([cell(6229,{body:para("Level 9",{b:1})}),cell(6821,{body:para("Level 9 and 10",{b:1})})]),
    tr([cell(6229,{body:para(std9)}),cell(6821,{body:para(std10)})])]);
  const sec3=table([3120,3120,6600],[
    tr([cell(12840,{span:3,fill:"C6ECFF",body:para(`${yearLevel} English: ${name}`,{b:1})})]),
    tr([cell(3120,{body:para("Strand: "+strand)}),cell(3120,{body:para("Sub-strand: "+sub)}),cell(6600,{body:para(`Recommended teaching time: ${u.length} weeks`)})])]);
  const catName=((cat.topic||"").split(":").slice(1).join(":")||cat.topic||name).trim();
  const euLI=`We will explore how ${focusPhrase} shape meaning, and apply this in ${catName}.`;
  const euSC=`I can use evidence from the text to explain how ${focusPhrase} shape meaning, and structure this in ${catName}.`;
  const eu=para("Learning Intention:",{b:1})+para(euLI)+para("Success Criteria:",{b:1})+para(euSC);
  const bigRows=[
    tr([cell(4263,{fill:"D1E8B2",body:para("The Big Question / Idea",{b:1})}),cell(8594,{fill:"D1E8B2",body:para("Essential Understandings",{b:1})})]),
    tr([cell(4263,{body:para(name,{b:1})+para("What students do in this unit:",{b:1})+bullets(topics)}),cell(8594,{vm:"restart",body:eu})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Cross Curricular Priorities",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:cross}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Capabilities curriculum",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:caps}),cell(8594,{vm:"continue"})])];
  const sec4=table([4263,8594],bigRows);
  const sec5=table(W,[
    tr([cell(4263,{span:3,fill:"D1E8B2",body:para("Common Assessments",{b:1})}),cell(8594,{span:2,fill:"D1E8B2",body:para("21CLD",{b:1})})]),
    tr([cell(W[0],{body:para("Pre-assessment",{b:1})+para(preText)}),
        cell(W[1],{body:para("Formative (ongoing)",{b:1})+para(formText)}),
        cell(W[2],{body:para("Summative (final)",{b:1})+catText}),
        cell(W[3],{body:cld}),
        cell(W[4],{})])]);

  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', R="http://schemas.openxmlformats.org/officeDocument/2006/relationships", CT="application/vnd.openxmlformats-officedocument.wordprocessingml.";
  const body=para(`English · ${yearLevel} · ${name}`,{b:1,sz:24})+sec1+para("")+sec2+para("")+sec3+para("")+sec4+para("")+sec5+para("");
  return zip({
    "[Content_Types].xml":X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CT}document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CT}styles+xml"/></Types>`,
    "_rels/.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/></Relationships>`,
    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}
document.getElementById("upv2btn").onclick=()=>{
  const us=units(), dl=document.createElement("dialog");dl.className="units";dl.setAttribute("aria-labelledby","up2h");
  dl.innerHTML=`<h2 id="up2h">Unit plans</h2><p>Each unit runs from its first lesson to its CAT.</p>`+
    (us.length?`<ul>${us.map((u,i)=>`<li><span><b>${esc(unitName(u))}</b><small>${unitSpan(u)}</small></span><button type="button" class="btn" data-i="${i}">Download .docx</button></li>`).join("")}</ul>`:"<p>No CATs in this plan yet.</p>")+
    `<form method="dialog"><button class="btn">Close</button></form>`;
  dl.addEventListener("click",e=>{
    if(e.target===dl)return dl.close();
    const b=e.target.closest("[data-i]");if(!b)return;
    const u=us[b.dataset.i], a=document.createElement("a"), url=URL.createObjectURL(unitDocxV2(u));
    a.href=url;a.download=`${document.title.split(" ")[0]} Unit Plan - ${unitName(u).replace(/[\\/:*?"<>|]/g,"")}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  dl.addEventListener("close",()=>dl.remove());
  document.body.appendChild(dl);dl.showModal();
};

</script>
</body>
</html>
