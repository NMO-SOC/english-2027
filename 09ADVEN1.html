<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09ADVEN1 Curriculum Plan 2027</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--line:#9aa5b1;--bg:#f7f7f5;--navy:#1d2b4f;--muted:#4a5562;--ph:#5b6570;--now:#a87400;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:16px;top:8px;z-index:5;background:#fff;color:var(--navy);padding:8px 12px;border:2px solid var(--navy);font-weight:bold}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
  header h1{text-align:center}
  .home{justify-self:start}
  h1{margin:0;background:var(--navy);color:#fff;padding:8px 18px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:0;outline-offset:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tools button,.btn{font:inherit;font-size:14px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tools button:hover,.btn:hover{border-color:var(--navy)}
  #save{background:var(--navy);color:#fff;border-color:var(--navy)}
  .menu{position:relative}
  .menu summary{list-style:none}
  .menu summary::-webkit-details-marker{display:none}
  .menu summary::after{content:"\25BE";content:"\25BE" / "";margin-left:6px}
  .menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:flex;flex-direction:column;min-width:230px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .tools .menu-list button{border:none;width:100%}
  .tools .menu-list button:hover{background:#eef1f6}
  .tools #clear{margin-left:12px;color:#9b1c1c;border-color:#d9a8a8}
  .tools #clear:hover{border-color:#9b1c1c;background:#fdf2f2}
  .home{gap:8px;font-weight:bold;color:var(--navy);border-color:var(--navy)}
  #status{font-size:14px;color:var(--muted)}
  #status:empty{display:none}
  .hint{font-size:14px;color:var(--muted);margin:0 auto 14px;max-width:80ch;text-align:center}
  @media (max-width:900px){header{grid-template-columns:1fr}header>*{justify-self:start}.tools{justify-content:flex-start}.menu-list{right:auto;left:0}.hint{text-align:left;margin-left:0}}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  .grid:focus{outline:none}
  section,.overview{background:#fff;padding:10px;border:1px solid #ddd;border-top:5px solid var(--c);overflow-x:auto}
  h2{text-align:center;margin:4px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--c)}
  .dates{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;table-layout:fixed;font-size:13px}
  th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
  td{scroll-margin-top:60px}
  thead th{font-size:14px}
  thead th small{display:block;font-weight:normal;font-size:12px}
  .hol{display:block;font-size:12px;font-weight:normal}
  .tag{display:block;font-size:12px;font-weight:bold}
  .t1{--c:#2a5f9e;--l:#dce8f6}.t2{--c:#2e7d32;--l:#dcefdb}.t3{--c:#a8532a;--l:#f6e1d5}.t4{--c:#7e3f84;--l:#efdff0}
  .term thead th{background:var(--c);color:#fff}
  .term thead th.grey{background:#5f666d}
  td{background:#fff}
  td.grey{background:#e1e3e5;color:#4a5057}
  /* week topic leads the column */
  .wn{min-height:26px;font-family:var(--serif);font-size:15px;line-height:1.25;font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none;word-wrap:break-word}
  .wn:empty::before{content:var(--wnl,"Notes / CAT");color:var(--ph);font-weight:normal}
  .wn.cat,.wn.dev{font-family:var(--sans);line-height:1.3;background:var(--navy);color:#fff;border:none;border-radius:3px;padding:4px 5px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .wn.cat:empty::before,.wn.dev:empty::before{content:none}
  .ck{display:block;font-size:12px;font-weight:normal;opacity:.9}
  .ct{display:block;font-size:13.5px}
  .les{margin-top:3px}
  .lh{cursor:pointer;background:#fff;padding:5px 7px;font-weight:bold;border:1px solid var(--line);border-left:4px solid var(--line);user-select:none;font-size:13.5px}
  .lt{font-weight:normal}
  /* clickable bars respond on hover */
  .lh:hover{background:#eef1f6}
  .cch:hover{background:rgba(0,0,0,.12)}
  .wn.cat:hover,.wn.dev:hover{background:#2c3f6b}
  .wn.dev{background:#0f6e6a}
  .wn.dev:hover{background:#15807b}
  .lh::before,.cch::before{content:"\25B8  ";content:"\25B8  " / ""}
  .les.open .lh::before,.ccw.open .cch::before{content:"\25BE  ";content:"\25BE  " / ""}
  /* lessons with content get the term colour on their edge */
  .les.filled .lh{border-left-color:var(--c)}
  td.grey .les.filled .lh{border-left-color:#5f666d}
  /* collapsible panels use hidden="until-found" so Ctrl+F can find and open them */
  .lb,.codes,.info{display:block}
  .lb[hidden],.codes[hidden],.info[hidden]{display:none}
  .uf .lb[hidden],.uf .codes[hidden],.uf .info[hidden]{display:block;min-height:0;padding:0;border:0;margin:0}
  .lb{min-height:50px;padding:4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word}
  .fl{font-size:12px;font-weight:bold;color:var(--muted);margin:6px 0 1px}
  .cpall{margin:8px 0 2px;text-align:right}
  .cp{font:inherit;font-size:13px;min-height:30px;padding:4px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
  .cp:hover{border-color:var(--navy)}
  .cp.done{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fld{min-height:22px;padding:2px 4px;border-bottom:1px dotted #6b7680;outline:none;word-wrap:break-word;font-size:13.5px}
  .fld ul{margin:0;padding-left:16px}
  .fld li+li{margin-top:2px}
  .fld:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .fld:focus,.codes:focus{background:#fffbe6}
  .info{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 6px;margin:0 0 6px;font-size:13px;outline:none;word-wrap:break-word}
  .info:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .ccw{margin:0 0 4px}
  .cch{cursor:pointer;font-size:12px;font-weight:bold;color:#2d3748;background:rgba(0,0,0,.06);border:1px solid var(--line);padding:3px 7px;user-select:none}
  .codes{font-size:12px;color:#2d3748;padding:3px 4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word;outline:none}
  .codes:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  :focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .wn.cat:focus-visible,.wn.dev:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
  .wn:focus,.info:focus{outline:2px solid var(--navy)}
  /* live site is read-only (body.ro): .ed = editing only, .rd = read-only only */
  body.ro .ed,body:not(.ro) .rd{display:none!important}
  body.ro .wn:empty::before,body.ro .fld:empty::before,body.ro .info:empty::before,body.ro .codes:empty::before{content:none}
  body.ro .ccw:has(.codes:empty){display:none}
  body.ro .info:empty{display:none!important}
  .wn.cat,.wn.dev{padding:5px 6px}
  /* this week */
  th.now,td.now{box-shadow:inset 0 0 0 3px var(--now)}
  td.now{background:#fff8dc}
  th.now .tag{display:inline-block;background:var(--navy);border-radius:3px;padding:1px 6px;margin-top:3px}
  /* term jump links */
  .jump{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
  .jump a{color:#fff;background:var(--c);min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:14px}
  .jump a.nowlink{--c:var(--navy)}
  section{scroll-margin-top:60px}
  /* assessments at a glance (collapsible) */
  .overview{--c:var(--navy)}
  .overview summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0;border-radius:4px}
  .overview summary::-webkit-details-marker{display:none}
  .overview summary h2{margin:0;color:var(--navy)}
  .overview summary::before{content:"\25B8";content:"\25B8" / "";color:var(--navy);font-size:16px;transition:transform .15s}
  .overview[open] summary::before{transform:rotate(90deg)}
  .overview .count{font-size:13px;font-weight:bold;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px}
  .overview .more{font-size:13px;color:var(--muted)}
  .overview .more::after{content:"Show"}
  .overview[open] .more::after{content:"Hide"}
  .overview summary:hover h2{text-decoration:underline}
  .overview table{width:100%;table-layout:auto;margin-top:8px}
  .overview th{background:var(--navy);color:#fff;text-align:left;font-size:13px}
  .overview td{background:#fff;padding:6px}
  .overview td:first-child{white-space:nowrap}
  .overview td small{display:block;color:var(--muted)}
  .overview .ck{color:var(--muted);opacity:1}
  .overview a{color:var(--navy);font-weight:bold}
  /* plan search */
  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .search input{font:inherit;font-size:14px;min-height:36px;width:260px;padding:6px 10px;border:1px solid #6b7680;border-radius:4px;background:#fff}
  .search button{font:inherit;font-size:14px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
  #qcount{font-size:13px;color:var(--muted)}
  td.dim{opacity:.4}
  .hit{box-shadow:0 0 0 2px #e0a800}
  .hit.cur{box-shadow:0 0 0 3px var(--navy)}
  ::highlight(search){background:#ffe066;color:#1f2933}
  @media (prefers-reduced-motion:reduce){.overview summary::before{transition:none}}
  /* unit plan (Word) picker */
  .units{max-width:min(680px,calc(100vw - 32px));border:none;border-radius:8px;padding:20px 24px;color:var(--ink)}
  .units::backdrop{background:rgba(0,0,0,.45)}
  .units h2{margin:0 0 4px;color:var(--navy)}
  .units p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .units ul{list-style:none;margin:0 0 16px;padding:0}
  .units li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #e3e6ea}
  .units li span{flex:1}.units small{display:block;color:var(--muted)}
  /* bigger targets on touch screens */
  @media (pointer:coarse){.lh,.cch{min-height:40px;display:flex;align-items:center}.cp{min-height:44px}.jump a,.tools button,.btn{min-height:44px}}
  /* phones: weeks stack vertically instead of scrolling sideways */
  @media (max-width:640px){
    body{padding:12px}
    .term table{display:flex;flex-direction:column;width:100%!important;min-width:0!important}
    .term thead,.term tbody,.term tr{display:contents}
    .term th{order:calc(var(--o) * 2 - 1);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;text-align:left;margin-top:10px}
    .term th small,.term th .hol,.term th .tag{display:inline}
    .term td{order:calc(var(--o) * 2);border-top:none}
    .overview td:first-child{white-space:normal}
    .search{margin-left:0;width:100%}.search input{flex:1;width:auto}
    section,td{scroll-margin-top:120px}
  }
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .tools,.hint,.jump,.home,.skip{display:none}
    header{grid-template-columns:1fr}
    th.now,td.now,.hit{box-shadow:none}
    td.now{background:#fff}
    td.dim{opacity:1}
    .overview .more,.overview summary::before{display:none}
    .grid{gap:8px}
    section,.overview{border:none;border-top:4px solid var(--c)}
    section+section{break-before:page}
    .lb,.lb[hidden]{display:block!important;content-visibility:visible!important;min-height:30px!important;padding:4px!important;border:1px solid var(--line)!important;border-top:none!important}
    .lh::before,.cch::before,.wn:empty::before,.fld:empty::before{content:""}
    .cpall{display:none}
    .codes:not(:empty),.wn.cat + .info:not(:empty){display:block!important;content-visibility:visible!important;padding:3px 4px!important;border:1px solid var(--line)!important;margin:0 0 4px!important}
    .ccw:has(.codes:empty){display:none}
    .fld ul{padding:0;list-style:none}.fld li{display:inline}.fld li+li::before{content:" | "}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* "Print CATs and topics": weekly topics and CATs only */
    body.summary .les,body.summary .ccw{display:none!important}
    body.summary .wn{border-bottom:none}
  }
</style>

<script>
const TERMS=[
 {n:1,start:"2027-01-25",weeks:9,label:"Wed 27 Jan – Thu 25 Mar (students start Thu 28 Jan)",
  notes:{1:"Starts Wed",7:"Labour Day Mon",9:"Ends Thu (Good Fri)"},grey:{},hol:[7,9]},
 {n:2,start:"2027-04-12",weeks:11,label:"Mon 12 Apr – Fri 25 Jun",
  notes:{10:"King's Bday Mon"},grey:{9:"Exams",11:"Set-Up"},hol:[10],noLessons:[9],exam:[9]},
 {n:3,start:"2027-07-12",weeks:10,label:"Mon 12 Jul – Fri 17 Sep",notes:{},grey:{},hol:[]},
 {n:4,start:"2027-10-04",weeks:11,label:"Mon 4 Oct – Fri 17 Dec",
  notes:{5:"Cup Day Tue"},grey:{6:"Exams",8:"Step-Up",9:"Step-Up",10:"Activities Week",11:"Clean-Up Week"},hol:[5],noLessons:[6,8,9,10,11],exam:[6]}
];
// Per-plan calendar changes, e.g. {"normalWeeks":[[2,9]]} makes Term 2 Week 9 a normal teaching week for that plan.
const PLAN={};
// Assessment word on the page: "CAT" by default, "SAC" for Year 12 (set by PLAN.assessWord)
const ASSESS=PLAN.assessWord||"CAT";
document.documentElement.style.setProperty("--wnl",JSON.stringify("Notes / "+ASSESS));
{const b=document.querySelector('button[onclick="printPlan(\'summary\')"]');if(b)b.textContent="Print "+ASSESS+"s and topics";}
(PLAN.normalWeeks||[]).forEach(([n,w])=>{const t=TERMS.find(x=>x.n===n);delete t.grey[w];t.noLessons=(t.noLessons||[]).filter(x=>x!==w);t.exam=(t.exam||[]).filter(x=>x!==w);});
(PLAN.notes||[]).forEach(([n,w,l])=>{const t=TERMS.find(x=>x.n===n);t.notes=t.notes||{};t.notes[w]=l;}); // e.g. [[2,11,"Step-Up"]] labels a week
(PLAN.greyWeeks||[]).forEach(([n,w,l])=>{const t=TERMS.find(x=>x.n===n);t.grey[w]=l;t.noLessons=(t.noLessons||[]).concat([w]);t.exam=(t.exam||[]).filter(x=>x!==w);}); // e.g. [[1,1,"Induction"]] greys out a week with no lessons
const DEFAULTS={"1--4": "S1_09ADVEN_CAT1: NAPLAN Practice", "1--8": "S1_09ADVEN_CAT2: Scene Analysis (12 Angry Men)", "2--6": "S1_09ADVEN_CAT3: Crafting Texts", "3--2": "Introduction to Contentions and Arguments", "3--6": "S2_09ADVEN_CAT2: Analysing Argument", "4--3": "Practice for CAT3: Analytical Text Response Essay", "1-4-3-li": "We will apply NAPLAN-style reading and writing strategies under timed conditions.", "1-4-3-sc": "I can locate information in a text to answer questions. | I can plan a response before I write. | I can check my spelling and punctuation.", "1-4-3-dn": "Read a short passage and name its text type and purpose.", "1-4-4-li": "We will evaluate my own timed writing against NAPLAN criteria.", "1-4-4-sc": "I can name one strength in my writing. | I can name one area to improve. | I can write a clear topic sentence.", "1-4-4-dn": "Read a sample response and rate it against the NAPLAN criteria.", "1-8-1-li": "We will analyse how dialogue and staging build tension in a scene.", "1-8-1-sc": "I can identify a key moment in the scene. | I can explain how a character's language shows their attitude. | I can link a technique to its effect on the audience.", "1-8-1-dn": "Read the opening lines of the scene aloud. Note who speaks and how they feel.", "1-8-2-li": "We will write an analytical paragraph about a scene from 12 Angry Men.", "1-8-2-sc": "I can write a topic sentence that names a technique. | I can support my point with a quotation. | I can explain the effect on the audience.", "1-8-2-dn": "Choose one quotation from the scene and write one sentence about its effect.", "2-6-1-li": "We will compose an original narrative in response to an unseen title.", "2-6-1-sc": "I can interpret the title in a meaningful way. | I can write a fictional or reflective narrative. | I can use setting, voice and language deliberately.", "2-6-1-dn": "Write your chosen interpretation of the title in one sentence.", "2-6-2-li": "We will complete our narrative and check it against the assessment criteria.", "2-6-2-sc": "I can complete a coherent, engaging narrative. | I can check my spelling, grammar and punctuation. | I can check my work against the six criteria.", "2-6-2-dn": "Read your ending aloud and check it links to your title.", "3-2-1-li": "We will define contention, argument and persuasive writing.", "3-2-1-sc": "I can define a contention. | I can explain how an argument supports a contention. | I can distinguish fact from opinion.", "3-2-1-dn": "Write one statement and label it fact or opinion.", "3-2-2-li": "We will identify contentions in a range of texts.", "3-2-2-sc": "I can identify the main contention in a text. | I can identify the tone and the intended audience. | I can identify supporting arguments and explain how they link to the contention.", "3-2-2-dn": "Read a headline and state what the writer is arguing.", "3-2-3-li": "We will evaluate the strength of arguments.", "3-2-3-sc": "I can identify evidence that supports an argument. | I can judge whether evidence is reliable. | I can explain why one argument is stronger.", "3-2-3-dn": "Name one argument and one piece of evidence that supports it.", "3-6-1-li": "We will identify and analyse the argument and persuasive techniques in a text.", "3-6-1-sc": "I can state the writer's main claim. | I can identify at least two persuasive techniques. | I can explain how each technique persuades the reader.", "3-6-1-dn": "Read the headline and predict the writer's position.", "3-6-2-li": "We will write an analytical response to an argument.", "3-6-2-sc": "I can write a thesis about how the argument persuades. | I can support each point with evidence from the text. | I can use analytical verbs such as 'suggests' and 'positions'.", "3-6-2-dn": "Write one sentence explaining the purpose of the article.", "4-3-1-li": "We will practise writing an analytical introduction in response to a prompt.", "4-3-1-sc": "I can unpack a prompt. | I can write an introduction with a clear contention. | I can foreshadow three arguments.", "4-3-1-dn": "Unpack a new prompt by underlining its key words.", "4-3-2-li": "We will practise writing body paragraphs using What, How and Why.", "4-3-2-sc": "I can write a What, How and Why paragraph. | I can embed a quotation. | I can explain its effect.", "4-3-2-dn": "Write a How sentence for a practice prompt.", "4-3-3-li": "We will practise writing a complete timed response to a practice prompt.", "4-3-3-sc": "I can complete an essay within the time limit. | I can use the structure we have learnt. | I can check that my contention answers the prompt.", "4-3-3-dn": "Read the practice prompt and state your contention in one sentence.", "1-1-1-li": "We will understand what 09ADVEN1 involves this year and how we will be assessed.", "1-1-1-sc": "I can name the CATs for Semester 1 and Semester 2. | I can describe what an analytical essay requires. | I can find the course outline and due dates.", "1-1-1-dn": "Write down three things you hope to learn in Advanced English this year.", "1--1": "NAPLAN Writing", "1--2": "NAPLAN Reading", "1--3": "NAPLAN Conventions of Language", "1-1-2-li": "We will identify the features of a NAPLAN writing task.", "1-1-2-sc": "I can identify the text type and audience in a prompt. | I can plan a response using a simple structure. | I can name the marking criteria.", "1-1-2-dn": "Read a sample NAPLAN writing prompt and underline the key instruction words.", "1-1-3-li": "We will plan and draft a structured NAPLAN-style response.", "1-1-3-sc": "I can write an introduction that states my position or idea. | I can use at least two supporting points. | I can write a conclusion that links back to my introduction.", "1-1-3-dn": "Brainstorm three ideas for a prompt in two minutes.", "1-1-4-li": "We will complete a timed practice NAPLAN writing test.", "1-1-4-sc": "I can respond to the prompt within the time limit. | I can keep my writing on topic. | I can check my spelling and punctuation in the final ecord my source.", "1-6-1-dn": "Write down one thing you already know about jury duty.", "1-6-2-li": "We will record key context findings to support our analysis.", "1-6-2-sc": "I can summarise two context points in my own words. | I can explain how context shapes the story. | I can note where I found each fact.", "1-6-2-dn": "Share one context fact with a partner.", "1-6-3-li": "We will track how the film builds tension in its first half.", "1-6-3-sc": "I can identify when the mood shifts. | I can note one technique used in a key scene. | I can record one question I have.", "1-6-3-dn": "Predict how the jury will vote at the start of the film.", "1-6-4-li": "We will reflect on how the film's choices shape the audience's view.", "1-6-4-sc": "I can name one choice the director made and its effect. | I can link one choice to my context research. | I can record the final vote and what it shows.", "1-6-4-dn": "Write one question you would like to explore in your analysis.", "1--7": "Practice for Scene Analysis CAT", "1-7-1-li": "We will practise identifying key moments in a scene for analysis.", "1-7-1-sc": "I can select a key moment. | I can identify the technique used. | I can explain its effect.", "1-7-1-dn": "Read a short scene extract and name one key moment.", "1-7-2-li": "We will practise writing an analytical paragraph.", "1-7-2-sc": "I can write a topic sentence naming a technique. | I can embed a quotation. | I can explain its effect in two sentences.", "1-7-2-dn": "Write a topic sentence for a practice scene.", "1-7-3-li": "We will practise timed analysis under CAT conditions.", "1-7-3-sc": "I can complete an analytical paragraph within the time limit. | I can check my work for accuracy. | I can identify one improvement to make.", "1-7-3-dn": "Read the CAT question carefully and underline its key instruction words.", "1-7-4-li": "We will reflect on our practice and set goals for the CAT.", "1-7-4-sc": "I can name one strength in my practice. | I can name one area to improve. | I can set one goal for Week 8.", "1-7-4-dn": "Write one question you have about the CAT.", "1-8-3-li": "We will draft a letter to a penpal in our sister school in China.", "1-8-3-sc": "I can include a greeting, body paragraphs and a sign-off. | I can describe myself and my school using specific details. | I can ask my penpal two questions about their life.", "1-8-3-dn": "Write one sentence introducing yourself to a penpal.", "1-8-4-li": "We will edit and finalise our letter to a penpal.", "1-8-4-sc": "I can check spelling and punctuation. | I can make my letter clear for a reader in another country. | I can add an intercultural question.", "1-8-4-dn": "Read your letter aloud and mark one sentence to improve.", "2--1": "Country: Landscape and Identity", "2-1-1-li": "We will explore what makes a place meaningful to people.", "2-1-1-sc": "I can explain the difference between a physical location and a cultural connection to place. | I can describe First Nations understandings of Country. | I can name the relationships Country includes.", "2-1-1-dn": "List three places that matter to you and say why.", "2-1-2-li": "We will examine how Paterson constructs the Australian landscape and the bushman identity.", "2-1-2-sc": "I can identify imagery and personification in the poem. | I can explain how the ballad form affects pace. | I can explain how the landscape shapes the protagonist.", "2-1-2-dn": "Find one image in the first stanza and say what it shows about the bush.", "2-1-3-li": "We will compare how Lawson and Paterson represent the bush.", "2-1-3-sc": "I can identify how Lawson builds atmosphere through setting. | I can explain how the harsh environment creates isolation. | I can compare Lawson's bush with Paterson's.", "2-1-3-dn": "Describe the bush in one sentence using a single adjective.", "2-1-4-li": "We will create a sense of place using sensory and figurative language.", "2-1-4-sc": "I can use at least three senses in a descriptive passage. | I alk about for three minutes.", "2-10-3-li": "We will develop a central message for our chosen topic.", "2-10-3-sc": "I can write one central message in a sentence. | I can list two or three supporting points. | I can identify who my audience is.", "2-10-3-dn": "Write one sentence stating what you want your audience to remember.", "2-10-4-li": "We will share our topic and central message with a partner.", "2-10-4-sc": "I can explain my topic in one minute. | I can give one piece of feedback to a partner. | I can respond to one question about my topic.", "2-10-4-dn": "Say your topic in one sentence to a partner.", "2--11": "Introduction to Oral Presentation (continued)", "2-11-1-li": "We will research our chosen topic using reliable sources.", "2-11-1-sc": "I can find two reliable sources. | I can record key information in my own words. | I can note where I found each source.", "2-11-1-dn": "Find one reliable source on your topic.", "2-11-2-li": "We will organise our research into a clear structure.", "2-11-2-sc": "I can order my points logically. | I can plan an opening that engages the audience. | I can plan a conclusion that restates my message.", "2-11-2-dn": "Write an opening sentence that hooks your audience.", "2-11-3-li": "We will practise speaking about our topic to build confidence.", "2-11-3-sc": "I can speak for one minute without reading. | I can use notes or cue cards. | I can identify one technique to improve engagement.", "2-11-3-dn": "Practise your opening line aloud three times.", "2-11-4-li": "We will reflect on our planning and set goals for the oral presentation.", "2-11-4-sc": "I can identify one strength in my plan. | I can name one area to strengthen. | I can set one delivery goal for Term 3.", "2-11-4-dn": "Write one goal for your oral presentation.", "3--1": "S2_09ADVEN_CAT1: Oral Presentation", "3-2-4-li": "We will write a clear contention statement.", "3-2-4-sc": "I can write a contention that takes a clear position. | I can support it with two arguments. | I can avoid vague wording.", "3-2-4-dn": "Rewrite 'Technology is sometimes bad' as a clear contention.", "3-1-1-li": "We will understand the oral presentation task and its criteria.", "3-1-1-sc": "I can explain what the task asks me to do. | I can name the assessment criteria. | I can identify the time limit.", "3-1-1-dn": "Read the criteria and circle the one you find hardest.", "3-1-2-li": "We will structure and rehearse our oral presentation.", "3-1-2-sc": "I can finalise the order of my points. | I can prepare cue cards. | I can time my rehearsal.", "3-1-2-dn": "Practise your first 30 seconds aloud.", "3-1-3-li": "We will refine our delivery using voice and body language.", "3-1-3-sc": "I can vary pace, volume and pauses. | I can use eye contact with the whole room. | I can use a visual aid that supports my point.", "3-1-3-dn": "Deliver your opening line with a different tone.", "3-1-4-li": "We will deliver our oral presentations and reflect on our performance.", "3-1-4-sc": "I can deliver within the time limit. | I can respond to one question. | I can name one strength and one next step.", "3-1-4-dn": "Write one thing you did well during your presentation.", "3--3": "Persuasive Techniques", "3-3-1-li": "We will identify the purpose of persuasive techniques.", "3-3-1-sc": "I can define emotive language, rhetorical questions and repetition. | I can explain the purpose of a persuasive technique. | I can identify one technique in a short text.", "3-3-1-dn": "Identify one emotive word in an advertisement.", "3-3-2-li": "We will recognise persuasive techniques in a range of texts.", "3-3-2-sc": "I can identify at least three techniques in a text. | I can name each technique accurately. | I can locate evidence for each technique.", "3-3-2-dn": "Find one rhetorical question in a headline.", "3-3-3-li": "We will explain how persuasive techniques affect the audience.", "3-3-3-sc": "I can link a technique to its effect. | I can use analytical language such as 'positions' and 'appeals'. | I can explain one likely audience response.", "3-3-3-dn": "Write one sentence explaining how a statistic might persuade a reader.", "3-3-4-li": "We will use persuasive techniques in our own writing.", "3-3-4-sc": "I can use at least two persuasive techniques. | I can match each technique to a purpose. | I can read my paragraph aloud and check it persuades.", "3-3-4-dn": "Write a sentence using a rhetorical question.", "3--4": "Analysing Visuals", "3-4-1-li": "We will identify the elements of a visual text.", "3-4-1-sc": "I can name colour, framing, angle and layout. | I can describe what the viewer sees first. | I can explain the purpose of an image.", "3-4-1-dn": "Describe the first thing you notice in an image.", "3-4-2-li": "We will analyse how visual techniques position the viewer.", "3-4-2-sc": "I can identify a visual technique. | I can explain its effect on the viewer. | I can link it to the contention.", "3-4-2-dn": "Note one colour choice in a poster and its effect.", "3-4-3-li": "We will analyse how images and words work together.", "3-4-3-sc": "I can explain how text and image reinforce each other. | I can identify symbolism in a visual. | I can explain the message communicated.", "3-4-3-dn": "Read the caption of an image and say how it changes the meaning.", "3-4-4-li": "We will write an analytical response to a visual text.", "3-4-4-sc": "I can write a topic sentence about a visual technique. | I can explain its effect on the audience. | I can use analytical language.", "3-4-4-dn": "Write one sentence describing the mood of an image.", "3--5": "Practice: Articles, Contentions and Techniques", "3-5-1-li": "We will identify the contention and arguments in an article.", "3-5-1-sc": "I can state the contention. | I can identify three arguments. | I can identify the intended audience.", "3-5-1-dn": "Read the headline and predict the contention.", "3-5-2-li": "We will identify and explain techniques in an article.", "3-5-2-sc": "I can identify at least three persuasive techniques. | I can explain the effect of each technique. | I can use a quotation as evidence.", "3-5-2-dn": "Highlight one emotive word in the first paragraph.", "3-5-3-li": "We will identify the contention and arguments in a second article.", "3-5-3-sc": "I can state the contention of the article. | I can identify its arguments and evidence. | I can compare its approach with the first article.", "3-5-3-dn": "Predict the contention from the headline of the second article.", "3-5-4-li": "We will analyse techniques in a second article to build exam skills.", "3-5-4-sc": "I can identify two techniques and explain their effects. | I can write one analytical sentence. | I can identify one difference between the two articles.", "3-5-4-dn": "Write one sentence comparing the two contentions.", "3-6-3-li": "We will research the life and times of William Shakespeare.", "3-6-3-sc": "I can identify when and where Shakespeare wrote. | I can explain one feature of Elizabethan theatre. | I can record my sources.", "3-6-3-dn": "Write down one thing you know about Shakespeare's theatre.", "3-6-4-li": "We will research the historical context of Julius Caesar.", "3-6-4-sc": "I can summarise the historical events the play is based on. | I can explain why Shakespeare's audience would know the story. | I can connect one context point to a theme in the play.", "3-6-4-dn": "List two things you know about ancient Rome.", "3--7": "Reading: Julius Caesar", "3--8": "Reading: Julius Caesar (continued)", "3--9": "Reading: Julius Caesar (continued)", "3--10": "Julius Caesar: Finish Reading and Film Adaptation", "3-7-1-li": "We will read Act 1 Scene 1 and identify the tension between the people and Caesar.", "3-7-1-sc": "I can identify the setting and the characters who speak. | I can explain why the tribunes are angry. | I can identify one image that suggests danger.", "3-7-1-dn": "Name one reason the crowd might celebrate Caesar and one reason they might not.", "3-7-2-li": "We will read Act 1 Scene 2 and analyse how Cassius persuades Brutus.", "3-7-2-sc": "I can explain Cassius's argument about Caesar's power. | I can identify the Soothsayer's warning. | I can explain one way Brutus's character is shown.", "3-7-2-dn": "Write one sentence describing how Cassius speaks to Brutus.", "3-7-3-li": "We will read Act 1 Scene 3 and examine how the storm builds tension.", "3-7-3-sc": "I can explain how the storm reflects the mood of Rome. | I can identify Cassius's plan to recruit Casca. | I can identify one omen.", "3-7-3-dn": "Describe the storm in one sentence using a strong verb.", "3-7-4-li": "We will read Act 2 Scene 1 and analyse Brutus's decision to join the conspiracy.", "3-7-4-sc": "I can explain Brutus's soliloquy and his reasoning. | I can identify how the conspirators persuade him. | I can explain why Brutus is trusted by the others.", "3-7-4-dn": "Write one reason Brutus gives for joining the conspiracy.", "3-8-1-li": "We will read Act 2 Scenes 2 to 4 and trace the signs that Caesar may be in danger.", "3-8-1-sc": "I can explain how Calpurnia's dream and the omens affect Caesar. | I can identify how Decius changes Caesar's mind. | I can explain the purpose of the letter and Portia's scene.", "3-8-1-dn": "Write one warning sign from these scenes.", "3-8-2-li": "We will read Act 3 Scene 1 and analyse the assassination and Antony's grief.", "3-8-2-sc": "I can explain how the conspirators justify the killing. | I can identify Antony's response to Caesar's death. | I can explain one dramatic irony in the scene.", "3-8-2-dn": "Write one line you think is most dramatic and explain why.", "3-8-3-li": "We will read Act 3 Scene 2 and compare Brutus's and Antony's funeral speeches.", "3-8-3-sc": "I can identify the persuasive techniques in each speech. | I can explain how the crowd's response changes. | I can compare the two speakers' purposes.", "3-8-3-dn": "Name one technique Antony uses that Brutus does not.", "3-8-4-li": "We will read Act 3 Scene 3 and Act 4 Scene 1 and track how power shifts in Rome.", "3-8-4-sc": "I can explain why Cinna the poet is killed. | I can identify the proscription list. | I can explain how the triumvirs gain power.", "3-8-4-dn": "Write one sentence explaining what the triumvirs want.", "3-9-1-li": "We will read Act 4 Scene 2 and examine Brutus's leadership at Sardis.", "3-9-1-sc": "I can identify the tension between Brutus and his officers. | I can explain Brutus's attitude to the army. | I can identify one sign that the conspiracy is failing.", "3-9-1-dn": "Describe Brutus's mood in this scene in one word and justify it.", "3-9-2-li": "We will read Act 4 Scene 3 and analyse the quarrel between Brutus and Cassius.", "3-9-2-sc": "I can explain the cause of the quarrel. | I can identify the news of Portia's death. | I can explain the significance of Caesar's ghost.", "3-9-2-dn": "Write one reason Brutus and Cassius disagree.", "3-9-3-li": "We will read Act 5 Scene 1 and examine the battle plans of both sides.", "3-9-3-sc": "I can identify the key decisions made by each army. | I can explain Brutus's and Cassius's disagreement about the battle. | I can explain how the scene builds anticipation.", "3-9-3-dn": "Write one prediction about the outcome of the battle.", "3-9-4-li": "We will read Act 5 Scenes 2 and 3 and analyse the battle and the death of Cassius.", "3-9-4-sc": "I can identify key events in the battle. | I can explain how Cassius's death happens. | I can explain one moment of dramatic irony.", "3-9-4-dn": "Write one sentence describing how Cassius dies.", "3-10-1-li": "We will read Act 5 Scene 4 and analyse how Lucilius's capture changes the battle.", "3-10-1-sc": "I can identify what Lucilius does to protect Brutus. | I can explain the effect of his capture. | I can explain how the scene shifts the balance of power.", "3-10-1-dn": "Write one sentence about Lucilius's loyalty.", "3-10-2-li": "We will read Act 5 Scene 5 and analyse Brutus's death and the final judgement on him.", "3-10-2-sc": "I can explain Brutus's final words. | I can identify how Antony describes Brutus. | I can explain the tragic outcome for Brutus.", "3-10-2-dn": "Write one word that describes Brutus at the end of the play.", "3-10-3-li": "We will view the film adaptation of Julius Caesar and track how key scenes are staged.", "3-10-3-sc": "I can identify two key scenes from the play. | I can compare one scene in the film to the text. | I can note one choice the director made.", "3-10-3-dn": "Predict how the film will show the assassination.", "3-10-4-li": "We will compare the film adaptation with the play and evaluate its interpretation.", "3-10-4-sc": "I can identify one change the director made. | I can explain how staging affects meaning. | I can give one reason the choice works or does not.", "3-10-4-dn": "Write one question you have about the film's ending.", "4-4-1-li": "We will analyse how Shakespeare presents a key theme in Julius Caesar.", "4-4-1-sc": "I can state a clear interpretation of a theme. | I can select a relevant quotation from the play. | I can explain how language reveals character.", "4-4-1-dn": "Recall one key event from Act 3 Scene 2 and its effect on the crowd.", "4-4-2-li": "We will connect evidence from the play to my interpretation in an analytical paragraph.", "4-4-2-sc": "I can write a topic sentence linked to my thesis. | I can embed a quotation and explain it in two or three sentences. | I can use Shakespearean language accurately.", "4-4-2-dn": "Explain in one sentence what 'honourable' means in Antony's speech.", "4-4-3-li": "We will structure and refine a complete analytical response.", "4-4-3-sc": "I can write an introduction with a clear thesis. | I can write a conclusion that extends my argument. | I can proofread for accuracy.", "4-4-3-dn": "Read your thesis aloud and check it answers the question.", "4--4": "S2_09ADVEN_CAT3: Analytical Text Response Essay (Julius Caesar)", "4--1": "Julius Caesar Recap and Essay Planning", "4-1-1-li": "We will recap the plot of Julius Caesar from beginning to end.", "4-1-1-sc": "I can sequence the major events of the play. | I can name the main characters and their roles. | I can identify the turning points.", "4-1-1-dn": "Write the three most important events of the play in order.", "4-1-2-li": "We will identify the key themes of Julius Caesar.", "4-1-2-sc": "I can name two central themes. | I can identify a scene that shows each theme. | I can explain how a theme develops.", "4-1-2-dn": "Name one theme of the play and one moment that shows it.", "4-1-3-li": "We will learn how to develop a contention and arguments for an analytical text response essay.", "4-1-3-sc": "I can write a clear contention that answers an analytical question. | I can identify three arguments that support a contention. | I can explain how each argument links to the contention.", "4-1-3-dn": "Rewrite a statement about the play as a contention.", "4-1-4-li": "We will plan an analytical text response essay from a prompt.", "4-1-4-sc": "I can unpack the key words in a prompt. | I can develop a contention and three arguments. | I can list evidence for each argument.", "4-1-4-dn": "Underline the key words in a sample prompt.", "4--2": "Essay Structure", "4-2-1-li": "We will learn how to structure the introduction of an analytical essay.", "4-2-1-sc": "I can introduce the text, author and form. | I can state a clear contention. | I can foreshadow three body paragraphs.", "4-2-1-dn": "Write one sentence introducing the text, author and form.", "4-2-2-li": "We will learn how to structure body paragraphs using What, How and Why.", "4-2-2-sc": "I can state what the argument is. | I can explain how the technique works. | I can explain why it matters to the contention.", "4-2-2-dn": "Write a 'What' sentence for one argument.", "4-2-3-li": "We will learn how to write a conclusion that restates and extends our contention.", "4-2-3-sc": "I can restate the contention in new words. | I can summarise the three arguments. | I can end with a final insight.", "4-2-3-dn": "Rewrite your contention as a conclusion sentence.", "4-2-4-li": "We will put the essay structure together and analyse a model essay.", "4-2-4-sc": "I can identify the introduction, body and conclusion in a model. | I can label the What, How and Why in one paragraph. | I can explain how the structure supports the contention.", "4-2-4-dn": "Label the parts of one model paragraph.", "4-3-4-li": "We will reflect on our practice responses and identify next steps for the CAT.", "4-3-4-sc": "I can identify one strength in my response. | I can identify one area to improve. | I can set a goal for the CAT.", "4-3-4-dn": "Name the paragraph you need to improve most.", "4-4-4-li": "We will begin revising for the exam, including the Julius Caesar essay prompt.", "4-4-4-sc": "I can recall the key features of an analytical essay. | I can plan a response to a Julius Caesar prompt. | I can identify the key scenes I need to revise.", "4-4-4-dn": "List three scenes from Julius Caesar you would use as evidence.", "4--5": "Exam Revision: Julius Caesar Essay", "4-5-1-li": "We will revise the structure of the analytical essay for the exam.", "4-5-1-sc": "I can name the parts of an introduction, body and conclusion. | I can explain the What, How and Why structure. | I can identify a clear contention.", "4-5-1-dn": "Write a contention for a Julius Caesar prompt.", "4-5-2-li": "We will revise the key themes and characters of Julius Caesar.", "4-5-2-sc": "I can name four key themes. | I can explain how one character embodies a theme. | I can link a theme to a key quotation.", "4-5-2-dn": "Name one character and one theme they represent.", "4-5-3-li": "We will practise planning a Julius Caesar essay under exam conditions.", "4-5-3-sc": "I can unpack a prompt. | I can develop a contention and three arguments. | I can plan within the time limit.", "4-5-3-dn": "Underline the key words  revise key characters and turning points in 12 Angry Men.", "2-8-1-sc": "I can name the key characters and their attitudes. | I can identify turning points in the play. | I can explain how one turning point builds tension.", "2-8-1-dn": "Name the juror who first votes not guilty.", "2-8-2-li": "We will practise analysing a scene from 12 Angry Men.", "2-8-2-sc": "I can identify a technique in the scene. | I can explain its effect on the audience. | I can use a quotation to support my point.", "2-8-2-dn": "Write a topic sentence naming one technique from a scene.", "2-8-3-li": "We will write an analytical paragraph under timed conditions.", "2-8-3-sc": "I can write a topic sentence linked to the question. | I can embed evidence and explain it. | I can finish within the time limit.", "2-8-3-dn": "Read the practice question and underline its key instruction words.", "2-8-4-li": "We will reflect on our scene analysis and plan next steps.", "2-8-4-sc": "I can identify one strength in my analysis. | I can identify one area to improve. | I can set a goal for the exam.", "2-8-4-dn": "Write one sentence explaining what you will revise tonight.", "2-9-1-li": "", "2-9-1-sc": "", "2-9-1-dn": "", "2-9-2-li": "", "2-9-2-sc": "", "2-9-2-dn": "", "2-9-3-li": "", "2-9-3-sc": "", "2-9-3-dn": "", "2-9-4-li": "", "2-9-4-sc": "", "2-9-4-dn": "", "2--9": "EXAM: Creating Texts and Scene Analysis (12 Angry Men)", "2--10": "Introduction to Oral Presentation", "2-10-1-li": "We will explore the purpose and structure of an oral presentation.", "2-10-1-sc": "I can explain the purpose of an oral presentation. | I can identify the parts of a presentation. | I can name the oral assessment criteria.", "2-10-1-dn": "Name one presentation you have watched and what made it engaging.", "2-10-2-li": "We will choose a topic we care about for our oral presentation.", "2-10-2-sc": "I can brainstorm three possible topics. | I can explain why my topic matters to me. | I can check my topic can be explored in k a technique to its effect. | I can use analytical language such as 'positions' and 'appeals'. | I can explain one likely audience response.", "3-3-3-dn": "Write one sentence explaining how a statistic might persuade a reader.", "3-3-4-li": "We will use persuasive techniques in our own writing.", "3-3-4-sc": "I can use at least two persuasive techniques. | I can match each technique to a purpose. | I can read my paragraph aloud and check it persuades.", "3-3-4-dn": "Write a sentence using a rhetorical question.", "3--4": "Analysing Visuals", "3-4-1-li": "We will identify the elements of a visual text.", "3-4-1-sc": "I can name colour, framing, angle and layout. | I can describe what the viewer sees first. | I can explain the purpose of an image.", "3-4-1-dn": "Describe the first thing you notice in an image.", "3-4-2-li": "We will analyse how visual techniques position the viewer.", "3-4-2-sc": "I can identify a visual technique. | I can explain its effect on the viewer. | I can link it to the contention.", "3-4-2-dn": "Note one colour choice in a poster and its effect.", "3-4-3-li": "We will analyse how images and words work together.", "3-4-3-sc": "I can explain how text and image reinforce each other. | I can identify symbolism in a visual. | I can explain the message communicated.", "3-4-3-dn": "Read the caption of an image and say how it changes the meaning.", "3-4-4-li": "We will write an analytical response to a visual text.", "3-4-4-sc": "I can write a topic sentence about a visual technique. | I can explain its effect on the audience. | I can use analytical language.", "3-4-4-dn": "Write one sentence describing the mood of an image.", "3--5": "Practice: Articles, Contentions and Techniques", "3-5-1-li": "We will identify the contention and arguments in an article.", "3-5-1-sc": "I can state the contention. | I can identify three arguments. | I can identify the intended audience.", "3-5-1-dn": "Read the headline and predict the contention.", "3-5-2-li": "We will identify and explain techniques in an article.", "3-5-2-sc": "I can identify at least three persuasive techniques. | I can explain the effect of each technique. | I can use a quotation as evidence.", "3-5-2-dn": "Highlight one emotive word in the first paragraph.", "3-5-3-li": "We will identify the contention and arguments in a second article.", "3-5-3-sc": "I can state the contention of the article. | I can identify its arguments and evidence. | I can compare its approach with the first article.", "3-5-3-dn": "Predict the contention from the headline of the second article.", "3-5-4-li": "We will analyse techniques in a second article to build exam skills.", "3-5-4-sc": "I can identify two techniques and explain their effects. | I can write one analytical sentence. | I can identify one difference between the two articles.", "3-5-4-dn": "Write one sentence comparing the two contentions.", "3-6-3-li": "We will research the life and times of William Shakespeare.", "3-6-3-sc": "I can identify when and where Shakespeare wrote. | I can explain one feature of Elizabethan theatre. | I can record my sources.", "3-6-3-dn": "Write down one thing you know about Shakespeare's theatre.", "3-6-4-li": "We will research the historical context of Julius Caesar.", "3-6-4-sc": "I can summarise the historical events the play is based on. | I can explain why Shakespeare's audience would know the story. | I can connect one context point to a theme in the play.", "3-6-4-dn": "List two things you know about ancient Rome.", "3--7": "Reading: Julius Caesar", "3--8": "Reading: Julius Caesar (continued)", "3--9": "Reading: Julius Caesar (continued)", "3--10": "Julius Caesar: Finish Reading and Film Adaptation", "3-7-1-li": "We will read Act 1 Scene 1 and identify the tension between the people and Caesar.", "3-7-1-sc": "I can identify the setting and the characters who speak. | I can explain why the tribunes are angry. | I can identify one image that suggests danger.", "3-7-1-dn": "Name one reason the crowd might celebrate Caesar and one reason they might not.", "3-7-2-li": "We will read Act 1 Scene 2 and analyse how Cassius persuades Brutus.", "3-7-2-sc": "I can explain Cassius's argument about Caesar's power. | I can identify the Soothsayer's warning. | I can explain one way Brutus's character is shown.", "3-7-2-dn": "Write one sentence describing how Cassius speaks to Brutus.", "3-7-3-li": "We will read Act 1 Scene 3 and examine how the storm builds tension.", "3-7-3-sc": "I can explain how the storm reflects the mood of Rome. | I can identify Cassius's plan to recruit Casca. | I can identify one omen.", "3-7-3-dn": "Describe the storm in one sentence using a strong verb.", "3-7-4-li": "We will read Act 2 Scene 1 and analyse Brutus's decision to join the conspiracy.", "3-7-4-sc": "I can explain Brutus's soliloquy and his reasoning. | I can identify how the conspirators persuade him. | I can explain why Brutus is trusted by the others.", "3-7-4-dn": "Write one reason Brutus gives for joining the conspiracy.", "3-8-1-li": "We will read Act 2 Scenes 2 to 4 and trace the signs that Caesar may be in danger.", "3-8-1-sc": "I can explain how Calpurnia's dream and the omens affect Caesar. | I can identify how Decius changes Caesar's mind. | I can explain the purpose of the letter and Portia's scene.", "3-8-1-dn": "Write one warning sign from these scenes.", "3-8-2-li": "We will read Act 3 Scene 1 and analyse the assassination and Antony's grief.", "3-8-2-sc": "I can explain how the conspirators justify the killing. | I can identify Antony's response to Caesar's death. | I can explain one dramatic irony in the scene.", "3-8-2-dn": "Write one line you think is most dramatic and explain why.", "3-8-3-li": "We will read Act 3 Scene 2 and compare Brutus's and Antony's funeral speeches.", "3-8-3-sc": "I can identify the persuasive techniques in each speech. | I can explain how the crowd's response changes. | I can compare the two speakers' purposes.", "3-8-3-d .", "3-10-2-li": "We will read Act 5 Scene 5 and analyse Brutus's death and the final judgement on him.", "3-10-2-sc": "I can explain Brutus's final words. | I can identify how Antony describes Brutus. | I can explain the tragic outcome for Brutus.", "3-10-2-dn": "Write one word that describes Brutus at the end of the play.", "3-10-3-li": "We will view the film adaptation of Julius Caesar and track how key scenes are staged.", "3-10-3-sc": "I can identify two key scenes from the play. | I can compare one scene in the film to the text. | I can note one choice the director made.", "3-10-3-dn": "Predict how the film will show the assassination.", "3-10-4-li": "We will compare the film adaptation with the play and evaluate its interpretation.", "3-10-4-sc": "I can identify one change the director made. | I can explain how staging affects meaning. | I can give one reason the choice works or does not.", "3-10-4-dn": "Write one question you have about the film's ending.", "4-4-1-li": "We will analyse how Shakespeare presents a key theme in Julius Caesar.", "4-4-1-sc": "I can state a clear interpretation of a theme. | I can select a relevant quotation from the play. | I can explain how language reveals character.", "4-4-1-dn": "Recall one key event from Act 3 Scene 2 and its effect on the crowd.", "4-4-2-li": "We will connect evidence from the play to my interpretation in an analytical paragraph.", "4-4-2-sc": "I can write a topic sentence linked to my thesis. | I can embed a quotation and explain it in two or three sentences. | I can use Shakespearean language accurately.", "4-4-2-dn": "Explain in one sentence what 'honourable' means in Antony's speech.", "4-4-3-li": "We will structure and refine a complete analytical response.", "4-4-3-sc": "I can write an introduction with a clear thesis. | I can write a conclusion that extends my argument. | I can proofread for accuracy.", "4-4-3-dn": "Read your thesis aloud and check it answers the question.", "4--4": "S2_09ADVEN_CAT3: Analytical Text Response Essay (Julius Caesar)", "4--1": "Julius Caesar Recap and Essay Planning", "4-1-1-li": "We will recap the plot of Julius Caesar from beginning to end.", "4-1-1-sc": "I can sequence the major events of the play. | I can name the main characters and their roles. | I can identify the turning points.", "4-1-1-dn": "Write the three most important events of the play in order.", "4-1-2-li": "We will identify the key themes of Julius Caesar.", "4-1-2-sc": "I can name two central themes. | I can identify a scene that shows each theme. | I can explain how a theme develops.", "4-1-2-dn": "Name one theme of the play and one moment that shows it.", "4-1-3-li": "We will learn how to develop a contention and arguments for an analytical text response essay.", "4-1-3-sc": "I can write a clear contention that answers an analytical question. | I can identify three arguments that support a contention. | I can explain how each argument links to the contention.", "4-1-3-dn": "Rewrite a statement about the play as a contention.", "4-1-4-li": "We will plan an analytical text response essay from a prompt.", "4-1-4-sc": "I can unpack the key words in a prompt. | I can develop a contention and three arguments. | I can list evidence for each argument.", "4-1-4-dn": "Underline the key words in a sample prompt.", "4--2": "Essay Structure", "4-2-1-li": "We will learn how to structure the introduction of an analytical essay.", "4-2-1-sc": "I can introduce the text, author and form. | I can state a clear contention. | I can foreshadow three body paragraphs.", "4-2-1-dn": "Write one sentence introducing the text, author and form.", "4-2-2-li": "We will learn how to structure body paragraphs using What, How and Why.", "4-2-2-sc": "I can state what the argument is. | I can explain how the technique works. | I can explain why it matters to the contention.", "4-2-2-dn": "Write a 'What' sentence for one argument.", "4-2-3-li": "We will learn how to write a conclusion that restate // Search: highlights matches, opens the lessons they're in, fades other weeks. Display only.
(()=>{
  const q=document.getElementById("q"),cnt=document.getElementById("qcount"),next=document.getElementById("qnext");
  const HL=window.CSS&&CSS.highlights&&window.Highlight;
  let hits=[],cur=-1,opened=[],timer;
  function clear(){
    opened.forEach(([b,p])=>setOpen(b,p,false));opened=[];
    document.querySelectorAll(".hit,.dim").forEach(e=>e.classList.remove("hit","cur","dim"));
    if(HL)CSS.highlights.delete("search");
    hits=[];cur=-1;next.hidden=true;cnt.textContent="";
  }
  function open(b,p){if(p.hidden){setOpen(b,p,true);opened.push([b,p]);}}
  function run(){
    clear();
    const term=q.value.trim().toLowerCase();
    if(term.length<2)return;
    const ranges=[];let weeks=0;
    document.querySelectorAll(".term td").forEach(td=>{
      let found=false;
      td.querySelectorAll(".wn,.info,.codes,.lh,.fld").forEach(el=>{
        if(!el.textContent.toLowerCase().includes(term))return;
        found=true;
        const les=el.closest(".les");
        if(les){const b=les.querySelector(".lh");open(b,b.nextElementSibling);}
        else if(el.classList.contains("codes"))open(el.previousElementSibling,el);
        else if(el.classList.contains("info")&&el.previousElementSibling.classList.contains("cat"))open(el.previousElementSibling,el);
        const box=les||el;if(!hits.includes(box)){hits.push(box);box.classList.add("hit");}
        if(HL){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
          while((n=tw.nextNode())){const s=n.data.toLowerCase();let i=s.indexOf(term);
            while(i>-1){const r=new Range();r.setStart(n,i);r.setEnd(n,i+term.length);ranges.push(r);i=s.indexOf(term,i+term.length);}}}
      });
      if(found)weeks++;else td.classList.add("dim");
    });
    if(HL&&ranges.length)CSS.highlights.set("search",new Highlight(...ranges));
    cnt.textContent=hits.length?`${hits.length} match${hits.length>1?"es":""} in ${weeks} week${weeks>1?"s":""}`:"No matches. Check the spelling or try a shorter word.";
    next.hidden=!hits.length;
  }
  function go(){
    if(!hits.length)return;
    if(cur>-1)hits[cur].classList.remove("cur");
    cur=(cur+1)%hits.length;hits[cur].classList.add("cur");
    hits[cur].scrollIntoView({block:"center",inline:"center"});
    if(hits.length>1)cnt.textContent=`Match ${cur+1} of ${hits.length}`;
  }
  q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,150);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);if(!hits.length)run();go();}if(e.key==="Escape"){q.value="";clear();}});
  next.addEventListener("click",go);
})();

// Unit plans: a unit runs from the first week after the previous assessment to its CAT. Exams have no unit plan.
// Exported as a Word curriculum map in the school's format. Read-only: works on the live site too.
function units(){
  const out=[];let cur=[];
  TERMS.forEach(t=>{for(let w=1;w<=t.weeks;w++){
    if(((t.noLessons||[]).includes(w)||t.grey[w])&&!(t.exam||[]).includes(w))continue; // Set-Up, Step-Up and so on (grey weeks are not teaching weeks)
    if((PLAN.noUnit||[]).some(([n,x])=>n===t.n&&x===w))continue; // in the plan's lessons, but not part of any unit (e.g. post-exam week)
    const k=`${t.n}--${w}`;
    cur.push({t:t.n,w,k,lessons:lessonNames(t,w)});
    const v=(store[k]||"").trim();
    if(CAT.test(v)){if(!v.startsWith("EXAM"))out.push(cur);cur=[];} // exam revision weeks get no unit plan
  }});
  return out; // weeks after the last assessment have no CAT, so they form no unit
}

// Minimal zip (stored, no compression): all a .docx needs
function zip(files){
  const enc=new TextEncoder(),local=[],central=[];let off=0;
  const T=[...Array(256)].map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0;});
  const le=(...f)=>{const b=new Uint8Array(f.reduce((s,x)=>s+x[1],0)),v=new DataView(b.buffer);let i=0;for(const [x,n] of f){n===2?v.setUint16(i,x,true):v.setUint32(i,x,true);i+=n;}return b;};
  for(const [name,text] of Object.entries(files)){
    const nm=enc.encode(name),d=enc.encode(text);let c=~0;for(const b of d)c=T[(c^b)&255]^(c>>>8);c=~c>>>0;
    const common=[[20,2],[0,2],[0,2],[0,2],[33,2],[c,4],[d.length,4],[d.length,4],[nm.length,2],[0,2]];
    local.push(le([0x04034b50,4],...common),nm,d);
    central.push(le([0x02014b50,4],[20,2],...common,[0,2],[0,2],[0,2],[0,4],[off,4]),nm);
    off+=30+nm.length+d.length;
  }
  const size=central.reduce((s,b)=>s+b.length,0), n=Object.keys(files).length;
  return new Blob([...local,...central,le([0x06054b50,4],[0,2],[0,2],[n,2],[n,2],[size,4],[off,4],[0,2])],{type:CT_DOCX});
}

  const adj={
    eal:`Pre-teach the key terms for ${(subHits.length?subHits[0][1]:"this unit").toLowerCase()} with a word bank and visual glossary. Give sentence starters for each learning intention. Students plan the ${ASSESS} in dot points before drafting.`+opt(/oral|present|debate|speech/i," Record a practice run so students hear the model before they speak."),
    int:`Break each lesson into numbered steps with a visual organiser. Give annotated copies of the texts with key quotes highlighted. For the ${ASSESS}, allow extra time, a dictated or recorded response and a shorter word target.`+opt(/film|viewing|camels/i," Re-watch film clips in short sections, with a CAMELS+D checklist."),
    ext:`Students write their own analytical question about the unit and test it against the success criteria. Add a comparison with a second text, or a counter-argument, to the CAT.`+opt(/oral|present|debate/i," Students answer audience questions after their presentation.")+opt(/film|viewing/i," Students compare two film clips using CAMELS+D.")
  };
  const std9=`By the end of Level 9, students analyse how ${focusPhrase} shape meaning for an audience. They use evidence from the text to support their interpretation and organise their ideas in clear, structured responses.`;
  const std10=`By the end of Level 10, students evaluate how ${focusPhrase} position the audience and shape meaning. They sustain a clear interpretation or argument using precise, selected evidence, and adapt language and structure to purpose and audience.`;
  const formText=`Checked in every lesson against the success criteria, with the Do Now as an entry check (Weeks 1–${weeks.length}).`;
  const catInfo=(store["info-"+cat.k]||"").trim();
  const strandCounts={};
  codes.forEach(c=>{const mm=c.match(/^VC2E\d+(LA|LE|LY)/); if(mm) strandCounts[mm[1]]=(strandCounts[mm[1]]||0)+1;});
  const STRAND={LA:"Language",LE:"Literature",LY:"Literacy"};
  const top=Object.entries(strandCounts).sort((a,b)=>b[1]-a[1])[0];
  const strand=top?STRAND[top[0]]:"to be added";
  const corpus=[name,...topics,...liU,...scU,...dns,...titles,catInfo].join(" ").toLowerCase();
  const tick=(on,label)=>para((on?"☒ ":"☐ ")+label);
  const cross=UP2_CROSS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const caps=UP2_CAPS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const cld=UP2_CLD.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const firstWeek=weeks[0];
  const preText=firstDn?`Week 1 Do Now (diagnostic): ${firstDn}`:`Diagnostic at the start of the unit: students write what they already know about "${topics[0]||name}" and one question they have.`;
  const catText=para(cat.topic||"To be added",{b:1})+(catInfo?bullets(catInfo.split("\n").filter(s=>s.trim()).map(s=>s.trim())):"");
  const W=[1421,1421,1421,2549,6045];

  const sec1=table([2850,5110,5110],[
    tr([cell(13070,{span:3,fill:"FFC0E3",body:para("Adjustments/ Scaffolds",{b:1})})]),
    tr([cell(2850,{body:para("EAL",{b:1})}),cell(5110,{body:para("Integration",{b:1})}),cell(5110,{body:para("Extension",{b:1})})]),
    tr([cell(2850,{body:para(adj.eal)}),cell(5110,{body:para(adj.int)}),cell(5110,{body:para(adj.ext)})])]);
  const sec2=table([6229,6821],[
    tr([cell(13050,{span:2,fill:"D9D9D9",body:para("Mapping to F–10 Victorian Curriculum 2.0",{b:1})})]),
    tr([cell(13050,{span:2,body:para("Content description: "+(codes.join(", ")||"to be added"))})]),
    tr([cell(13050,{span:2,fill:"D1E8B2",body:para("Achievement standard",{b:1})})]),
    tr([cell(6229,{body:para("Level 9",{b:1})}),cell(6821,{body:para("Level 9 and 10",{b:1})})]),
    tr([cell(6229,{body:para(std9)}),cell(6821,{body:para(std10)})])]);
  const sec3=table([3120,3120,6600],[
    tr([cell(12840,{span:3,fill:"C6ECFF",body:para(`${yearLevel} English: ${name}`,{b:1})})]),
    tr([cell(3120,{body:para("Strand: "+strand)}),cell(3120,{body:para("Sub-strand: "+sub)}),cell(6600,{body:para(`Recommended teaching time: ${u.length} weeks`)})])]);
  const catName=((cat.topic||"").split(":").slice(1).join(":")||cat.topic||name).trim();
  const euLI=`We will explore how ${focusPhrase} shape meaning, and apply this in ${catName}.`;
  const euSC=`I can use evidence from the text to explain how ${focusPhrase} shape meaning, and structure this in ${catName}.`;
  const eu=para("Learning Intention:",{b:1})+para(euLI)+para("Success Criteria:",{b:1})+para(euSC);
  const bigRows=[
    tr([cell(4263,{fill:"D1E8B2",body:para("The Big Question / Idea",{b:1})}),cell(8594,{fill:"D1E8B2",body:para("Essential Understandings",{b:1})})]),
    tr([cell(4263,{body:para(name,{b:1})+para("What students do in this unit:",{b:1})+bullets(topics)}),cell(8594,{vm:"restart",body:eu})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Cross Curricular Priorities",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:cross}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Capabilities curriculum",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:caps}),cell(8594,{vm:"continue"})])];
  const sec4=table([4263,8594],bigRows);
  const sec5=table(W,[
    tr([cell(4263,{span:3,fill:"D1E8B2",body:para("Common Assessments",{b:1})}),cell(8594,{span:2,fill:"D1E8B2",body:para("21CLD",{b:1})})]),
    tr([cell(W[0],{body:para("Pre-assessment",{b:1})+para(preText)}),
        cell(W[1],{body:para("Formative (ongoing)",{b:1})+para(formText)}),
        cell(W[2],{body:para("Summative (final)",{b:1})+catText}),
        cell(W[3],{body:cld}),
        cell(W[4],{})])]);

  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', R="http://schemas.openxmlformats.org/officeDocument/2006/relationships", CT="application/vnd.openxmlformats-officedocument.wordprocessingml.";
  const body=para(`English · ${yearLevel} · ${name}`,{b:1,sz:24})+lpLine+sec1+para("")+sec2+para("")+sec3+para("")+sec4+para("")+sec5+para("");
  return zip({
    "[Content_Types].xml":X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CT}document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CT}styles+xml"/></Types>`,
    "_rels/.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/>${lpRels.join("")}</Relationships>`,
    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}
document.getElementById("upv2btn").onclick=()=>{
  const us=units(), dl=document.createElement("dialog");dl.className="units";dl.setAttribute("aria-labelledby","up2h");
  dl.innerHTML=`<h2 id="up2h">Unit plans</h2><p>Each unit runs from its first lesson to its CAT.</p>`+
    (us.length?`<ul>${us.map((u,i)=>`<li><span><b>${esc(unitName(u))}</b><small>${unitSpan(u)}</small></span><button type="button" class="btn" data-i="${i}">Download .docx</button></li>`).join("")}</ul>`:"<p>No "+ASSESS+"s in this plan yet.</p>")+
    `<form method="dialog"><button class="btn">Close</button></form>`;
  dl.addEventListener("click",e=>{
    if(e.target===dl)return dl.close();
    const b=e.target.closest("[data-i]");if(!b)return;
    const u=us[b.dataset.i], a=document.createElement("a"), url=URL.createObjectURL(unitDocxV2(u));
    a.href=url;a.download=`${document.title.split(" ")[0]} Unit Plan - ${fileSafe(unitName(u))}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  dl.addEventListener("close",()=>dl.remove());
  document.body.appendChild(dl);dl.showModal();
};

</script>
</body>
</html>
