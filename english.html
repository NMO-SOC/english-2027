<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English overview 2027</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--bg:#f7f7f5;--muted:#4a5562;--navy:#1d2b4f;--line:#9aa5b1;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif;
    --t1:#2a5f9e;--t1l:#dce8f6;--t2:#2e7d32;--t2l:#dcefdb;--t3:#a8532a;--t3l:#f6e1d5;--t4:#7e3f84;--t4l:#efdff0;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .banner{background:var(--navy);color:#fff;text-align:center;padding:30px 16px 26px}
  .banner h1{margin:4px 0 6px;font-family:var(--serif);font-size:clamp(26px,5vw,38px);font-weight:700;line-height:1.1}
  .banner p{margin:0;opacity:.88;font-size:16px}
  .banner .back{display:inline-block;margin-bottom:10px;color:#fff;font-size:15px}
  .banner .asof{margin-top:12px;font-size:14px;opacity:.8}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);height:6px}
  .strip span:nth-child(1){background:var(--t1)}.strip span:nth-child(2){background:var(--t2)}
  .strip span:nth-child(3){background:var(--t3)}.strip span:nth-child(4){background:var(--t4)}
  .wrap{padding:22px 16px 40px}
  .term{background:#fff;border:1px solid var(--line);border-top:6px solid var(--c);margin:0 auto 26px;max-width:1400px}
  .term.t1{--c:var(--t1)}.term.t2{--c:var(--t2)}.term.t3{--c:var(--t3)}.term.t4{--c:var(--t4)}
  .term h2{margin:0;padding:10px 14px 2px;font-family:var(--serif);font-size:22px;color:var(--navy)}
  .term .dates{padding:0 14px 10px;font-size:14px;color:var(--muted)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:900px}
  th,td{border:1px solid var(--line);vertical-align:top;text-align:left;font-size:14px;line-height:1.35}
  thead th{background:var(--c);color:#fff;padding:6px 8px;font-weight:700}
  thead th small{display:block;font-weight:normal;font-size:12px;opacity:.95}
  thead th .tag{display:inline-block;margin-top:3px;font-size:11px;background:#fff;color:var(--navy);padding:0 6px;border-radius:999px}
  th.rowhead{background:#fff;color:var(--navy);font-family:var(--serif);font-size:16px;width:150px;min-width:150px}
  th.rowhead small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:normal}
  td{padding:6px 7px;min-width:120px;height:72px}
  td.grey{background:#e6e8eb;color:var(--muted);font-style:italic}
  td.cat{background:var(--navy);color:#fff}
  td.cat .code{display:block;font-size:11px;opacity:.85;letter-spacing:.02em}
  td.cat.exam{background:#5f666d}
  td.now,thead th.now{box-shadow:inset 0 0 0 3px #e0a800}
  td.now{background-color:#fff8dc}
  td.cat.now{background:var(--navy)}
  .y7 th.rowhead{border-left:6px solid var(--t1)} .y8 th.rowhead{border-left:6px solid var(--t2)}
  .y9 th.rowhead{border-left:6px solid var(--t3)} .y10 th.rowhead{border-left:6px solid var(--t4)}
  .y11 th.rowhead,.y12 th.rowhead{border-left:6px solid var(--navy)}
  .soonrow th.rowhead{color:var(--muted);font-weight:normal}
  .legend{max-width:1400px;margin:0 auto 20px;font-size:14px;color:var(--muted)}
  .legend span{display:inline-block;margin-right:14px}
  .legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
  .msg{max-width:800px;margin:0 auto;background:#fff;border:1px solid var(--line);padding:16px;border-radius:4px}
  .tools{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .tools button{font:inherit;font-size:15px;min-height:40px;padding:8px 16px;border:1px solid #fff;background:transparent;color:#fff;border-radius:4px;cursor:pointer}
  .tools button:hover{background:#fff;color:var(--navy)}
  @page{size:A3 landscape;margin:10mm}
  @media print{body{background:#fff}.banner{background:#fff;color:var(--ink);padding:0 0 8px}.banner .back,.tools,.strip,.legend{display:none}.term{break-inside:avoid;page-break-inside:avoid;border:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none}}
</style>
</head>
<body>
<header>
  <div class="banner">
    <a class="back" href="index.html">&larr; All plans</a>
    <h1>English overview 2027</h1>
    <p>Every year level, term by term: the topic each week, and when assessments are</p>
    <p class="asof" id="asof"></p>
    <div class="tools"><button type="button" onclick="window.print()">Print</button> <button type="button" id="lapbtn">Learning area plan (Word)</button></div>
  </div>
  <div class="strip"><span></span><span></span><span></span><span></span></div>
</header>
<main class="wrap" id="main"><p class="msg" id="loading">Loading the plans&hellip;</p></main>
<script>
// Read-only overview. It reads each plan's own data (TERMS and the saved entries), so it always matches the plans.
const CLASSES=[
  {soon:true,name:"Year 7 Mainstream",yr:"y7"},
  {soon:true,name:"Year 7 Advanced",yr:"y7"},
  {soon:true,name:"Year 8 Mainstream",yr:"y8"},
  {soon:true,name:"Year 8 Advanced",yr:"y8"},
  {code:"09EN",name:"Year 9 Mainstream",yr:"y9"},
  {code:"09ADVEN1",name:"Year 9 Advanced",yr:"y9"},
  {code:"10EN",name:"Year 10 Mainstream",yr:"y10"},
  {code:"10ADVEN1",name:"Year 10 Advanced",yr:"y10"},
  {soon:true,name:"Year 11 (VCE)",yr:"y11"},
  {soon:true,name:"Year 12 (VCE)",yr:"y12"}];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=d=>d.getDate()+" "+MON[d.getMonth()];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT=/^(S[12]_|EXAM)/;
const qd=new URLSearchParams(location.search).get("today");
const today=qd?new Date(qd+"T00:00"):new Date(); today.setHours(0,0,0,0);

async function loadPlan(c){
  const txt=await (await fetch(c.code+".html",{cache:"no-cache"})).text();
  const terms=new Function("return "+txt.match(/const TERMS=(\[[\s\S]*?\n\]);/)[1])();
  const dm=txt.match(/^const DEFAULTS=(\{.*\});$/m), sm=txt.match(/^const SAVED=(\{.*\});$/m);
  const store=Object.assign({},dm?JSON.parse(dm[1]):{},sm?JSON.parse(sm[1]):{});
  return Object.assign({},c,{terms,store});
}
// One cell: the week's topic, shown as a CAT, an exam, a grey week, or plain topic
function cellFor(p,t,w){
  const k=`${t.n}--${w}`, topic=(p.store[k]||"").trim(), g=(t.grey||{})[w]||"";
  if(g&&!topic) return {cls:"grey",html:esc(g)};
  if(CAT.test(topic)){
    const i=topic.indexOf(":");
    const code=i<0?topic:topic.slice(0,i), title=i<0?"":topic.slice(i+1).trim();
    return {cls:"cat"+(topic.startsWith("EXAM")?" exam":""),html:`<span class="code">${esc(code)}</span>${esc(title)}`};
  }
  return {cls:"",html:esc(topic)};
}
function render(plans){
  const ref=plans.find(p=>!p.soon);    // every plan has the same term calendar
  let out="";
  ref.terms.forEach(t=>{
    const weeks=[];
    const d0=new Date(t.start+"T00:00");
    for(let w=1;w<=t.weeks;w++){
      const d=new Date(d0); d.setDate(d.getDate()+7*(w-1));
      const e=new Date(d); e.setDate(e.getDate()+7);
      weeks.push({w,start:d,now:today>=d&&today<e,grey:(t.grey||{})[w]||""});
    }
    let h=`<section class="term t${t.n}"><h2>Term ${t.n}</h2><div class="dates">${esc(t.label)} · ${t.weeks} weeks</div>`+
      `<div class="scroll"><table><caption class="sr">Term ${t.n}: topic and assessments for each year level, by week</caption><thead><tr><th scope="col" class="rowhead">Class</th>`;
    weeks.forEach(x=>{
      h+=`<th scope="col"${x.now?' class="now"':""}>Week ${x.w}<small>${fmtD(x.start)}</small>`+
         `${x.grey?`<small>${esc(x.grey)}</small>`:""}${x.now?'<span class="tag">This week</span>':""}</th>`;
    });
    h+=`</tr></thead><tbody>`;
    plans.forEach(p=>{
      if(p.soon){
        h+=`<tr class="${p.yr} soonrow"><th scope="row" class="rowhead">${esc(p.name)}<small>Coming soon</small></th>`+weeks.map(()=>`<td class="grey"></td>`).join("")+`</tr>`;
        return;
      }
      h+=`<tr class="${p.yr}"><th scope="row" class="rowhead">${esc(p.name)}<small>${esc(p.code)}</small></th>`;
      weeks.forEach(x=>{
        const c=cellFor(p,t,x.w);
        const cls=[c.cls,x.now?"now":""].filter(Boolean).join(" ");
        h+=`<td${cls?` class="${cls}"`:""}>${c.html}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div></section>`;
    out+=h;
  });
  return `<div class="legend"><span><i style="background:var(--navy)"></i>Assessment (CAT)</span><span><i style="background:#5f666d"></i>Exam</span><span><i style="background:#e6e8eb"></i>Not a teaching week</span><span><i style="background:#fff8dc"></i>This week</span></div>`+out;
}
// Minimal zip (stored, no compression): all a .docx needs
function zip(files){
  const enc=new TextEncoder(),local=[],central=[];let off=0;
  const T=[...Array(256)].map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0;});
  const le=(...f)=>{const b=new Uint8Array(f.reduce((s,x)=>s+x[1],0)),v=new DataView(b.buffer);let i=0;for(const [x,n] of f){n===2?v.setUint16(i,x,true):v.setUint32(i,x,true);i+=n;}return b;};
  for(const [name,text] of Object.entries(files)){
    const nm=enc.encode(name),d=enc.encode(text);let c=~0;for(const b of d)c=T[(c^b)&255]^(c>>>8);c=~c>>>0;
    const common=[[20,2],[0,2],[0,2],[0,2],[33,2],[c,4],[d.length,4],[d.length,4],[nm.length,2],[0,2]];
    local.push(le([0x04034b50,4],...common),nm,d);
    central.push(le([0x02014b50,4],[20,2],...common,[0,2],[0,2],[0,2],[0,4],[off,4]),nm);
    off+=30+nm.length+d.length;
  }
  const size=central.reduce((s,b)=>s+b.length,0), n=Object.keys(files).length;
  return new Blob([...local,...central,le([0x06054b50,4],[0,2],[0,2],[n,2],[n,2],[size,4],[off,4],[0,2])],{type:CT_DOCX});
}
const CT_DOCX="application/vnd.openxmlformats-officedocument.wordprocessingml.document";

// Learning Area Plan (school format), built from the plans. One block per class: a topic row and a codes row per semester.
// Each unit's topic and codes cells are coloured by unit of work.
const LAP_PAL=["A8D08D","9DC3E6","F7CAAC","FFE699","C5E0B3","D9B3FF","F4B183","BDD7EE","E2EFDA","FCE4D6"];
const LAP_YEARS=[
  {name:"Year 7 Mainstream",code:null},{name:"Year 7 Advanced",code:null},
  {name:"Year 8 Mainstream",code:null},{name:"Year 8 Advanced",code:null},
  {name:"Year 9 Mainstream",code:"09EN"},{name:"Year 9 Advanced",code:"09ADVEN1"},
  {name:"Year 10 Mainstream",code:"10EN"},{name:"Year 10 Advanced",code:"10ADVEN1"}];
function lapWeeks(p,terms){
  const out=[];
  terms.forEach(t=>{for(let w=1;w<=t.weeks;w++){
    const start=new Date(t.start+"T00:00"); start.setDate(start.getDate()+7*(w-1));
    const k=`${t.n}--${w}`, g=(t.grey||{})[w]||"";
    if(g==="Step-Up") continue; // Step-Up is the start of the next semester
    out.push({t,w,k,start,grey:g,topic:((p.store||{})[k]||"").trim()});
  }});
  return out;
}
// Unit name for each week key (a unit runs to its CAT; exams are not units)
function lapUnits(p,weeks){
  const name={}; let cur=[];
  weeks.forEach(x=>{
    if((x.t.noLessons||[]).includes(x.w)&&!(x.t.exam||[]).includes(x.w)) return;
    cur.push(x.k);
    if(CAT.test(x.topic)){
      if(!x.topic.startsWith("EXAM")){const nm=x.topic.slice(x.topic.indexOf(":")+1).trim(); cur.forEach(k=>name[k]=nm);}
      cur=[];
    }
  });
  return name;
}
function lapDocx(plans){
  const WEEKS=20, TOT=22379, YW=572, SW=1427, EXW=1700, WW=Math.floor((TOT-YW-SW-EXW)/WEEKS);
  const bdr='<w:tcBorders><w:top w:val="single" w:sz="4" w:color="808080"/><w:left w:val="single" w:sz="4" w:color="808080"/><w:bottom w:val="single" w:sz="4" w:color="808080"/><w:right w:val="single" w:sz="4" w:color="808080"/></w:tcBorders>';
  const run=(text,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}<w:sz w:val="${o.sz||14}"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
  const par=(text,o={})=>`<w:p><w:pPr><w:spacing w:after="0" w:line="216" w:lineRule="auto"/>${o.c?'<w:jc w:val="center"/>':""}</w:pPr>${text?run(text,o):""}</w:p>`;
  // o.text may hold several lines (one paragraph each)
  const tc=(w,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.vm?`<w:vMerge${o.vm==="restart"?' w:val="restart"':""}/>`:""}${bdr}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}${o.dir?'<w:textDirection w:val="btLr"/>':""}<w:vAlign w:val="center"/></w:tcPr>${String(o.text||"").split("\n").map(l=>par(l,o)).join("")}</w:tc>`;
  const tr=cells=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${cells.join("")}</w:tr>`;
  const grid=[YW,SW,...Array(WEEKS).fill(WW),EXW];
  const rows=[];
  // header: the week numbers
  rows.push(tr([tc(YW,{fill:"F2F2F2"}),tc(SW,{text:"Week",b:1,c:1,fill:"F2F2F2"}),...Array.from({length:WEEKS},(_,i)=>tc(WW,{text:String(i+1),b:1,c:1,fill:"F2F2F2"})),tc(EXW,{text:"Exam Revision",b:1,c:1,fill:"F2F2F2"})]));
  const legend=[];
  const ref=plans.find(p=>!p.soon);
  LAP_YEARS.forEach(y=>{
    const p=y.code?plans.find(q=>q.code===y.code):null;
    const sems=[1,2].map(s=>{
      const terms=(p?p.terms:(ref?ref.terms:[])).filter(t=>s===1?t.n<=2:t.n>=3);
      const weeks=p?lapWeeks(p,terms):[];
      const un=p?lapUnits(p,weeks):{};
      const names=[...new Set(weeks.map(x=>un[x.k]).filter(Boolean))];
      const colour={}; names.forEach((n,i)=>colour[n]=LAP_PAL[i%LAP_PAL.length]);
      names.forEach(n=>legend.push({label:`${y.name} · Semester ${s}`,unit:n,fill:colour[n]}));
      const topicCells=[], codeCells=[];
      for(let i=0;i<WEEKS;i++){
        const x=weeks[i];
        if(!x){topicCells.push(tc(WW)); codeCells.push(tc(WW)); continue;}
        const isCat=CAT.test(x.topic), fill=un[x.k]?colour[un[x.k]]:null;
        topicCells.push(tc(WW,{text:x.topic||x.grey||"",b:isCat,fill}));
        const codes=((p.store||{})["codes-"+x.k]||"").split(/[\s,;]+/).filter(Boolean).join(", ");
        codeCells.push(tc(WW,{text:codes,fill}));
      }
      const exams=weeks.filter(x=>x.topic.startsWith("EXAM")).map(x=>x.topic);
      return {s,topicCells,codeCells,exam:exams.join("\n")};
    });
    const [a,b]=sems;
    const yr={vm:"restart",dir:1,fill:"F2F2F2",text:y.name,b:1};
    // rows for this class: S1 topic, S1 codes, S2 topic, S2 codes
    rows.push(tr([tc(YW,{...yr}),tc(SW,{vm:"restart",text:"Semester 1\nTopic / Subject\nCurriculum 2.0 codes",b:1,fill:"FFFFFF"}),...a.topicCells,tc(EXW,{text:a.exam?"Exam Revision\n"+a.exam:"Exam Revision",fill:"FFFFFF"})]));
    rows.push(tr([tc(YW,{vm:"continue",fill:"F2F2F2"}),tc(SW,{vm:"continue",fill:"FFFFFF"}),...a.codeCells,tc(EXW,{fill:"FFFFFF"})]));
    rows.push(tr([tc(YW,{vm:"continue",fill:"F2F2F2"}),tc(SW,{vm:"restart",text:"Semester 2\nTopic / Subject\nCurriculum 2.0 codes",b:1,fill:"FFFFFF"}),...b.topicCells,tc(EXW,{text:b.exam?"Exam Revision\n"+b.exam:"Exam Revision",fill:"FFFFFF"})]));
    rows.push(tr([tc(YW,{vm:"continue",fill:"F2F2F2"}),tc(SW,{vm:"continue",fill:"FFFFFF"}),...b.codeCells,tc(EXW,{fill:"FFFFFF"})]));
  });
  const mainTbl=`<w:tbl><w:tblPr><w:tblW w:w="${TOT}" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${grid.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${rows.join("")}</w:tbl>`;
  // unit colour key
  const LW=[4200,700,8000];
  const lrows=[tr([tc(LW[0],{text:"Class and semester",b:1,fill:"F2F2F2"}),tc(LW[1],{text:"",fill:"F2F2F2"}),tc(LW[2],{text:"Unit of work",b:1,fill:"F2F2F2"})]),
    ...legend.map(l=>tr([tc(LW[0],{text:l.label}),tc(LW[1],{text:"",fill:l.fill}),tc(LW[2],{text:l.unit})]))];
  const keyTbl=`<w:tbl><w:tblPr><w:tblW w:w="${LW.reduce((a,b)=>a+b)}" w:type="dxa"/><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${LW.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${lrows.join("")}</w:tbl>`;
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', R="http://schemas.openxmlformats.org/officeDocument/2006/relationships", CTX="application/vnd.openxmlformats-officedocument.wordprocessingml.";
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const title=`<w:p><w:pPr><w:spacing w:after="120"/></w:pPr>${run("Learning Area Plan - Years 7 to 10",{b:1,sz:32})}</w:p>`;
  const body=title+mainTbl+`<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>`+par("Unit colours",{b:1,sz:18})+keyTbl+`<w:p/>`;
  return zip({
    "[Content_Types].xml":X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CTX}document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CTX}styles+xml"/></Types>`,
    "_rels/.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/></Relationships>`,
    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="14"/><w:szCs w:val="14"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="23811" w:h="16838" w:orient="landscape"/><w:pgMar w:top="900" w:right="709" w:bottom="900" w:left="709" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}
document.getElementById("lapbtn").onclick=()=>{
  if(!window.PLANS){alert("The plans are still loading. Try again in a moment.");return;}
  const b=lapDocx(window.PLANS), a=document.createElement("a"), url=URL.createObjectURL(b);
  a.href=url;a.download="Learning Area Plan - Years 7 to 10.docx";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
(async()=>{
  document.getElementById("asof").textContent="Showing "+(qd?"the date "+qd:"today")+" ("+fmtD(today)+")";
  const main=document.getElementById("main");
  try{
    const plans=[];
    for(const c of CLASSES) plans.push(c.soon?c:await loadPlan(c));
    window.PLANS=plans;
    main.innerHTML=render(plans);
  }catch(e){
    main.innerHTML=`<p class="msg">The plans could not be read. Open this page from the website (not from a file on your computer) so the plans can load.</p>`;
  }
})();
</script>
</body>
</html>
