<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EN12 Curriculum Plan 2027</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--line:#9aa5b1;--bg:#f7f7f5;--navy:#1d2b4f;--muted:#4a5562;--ph:#5b6570;--now:#a87400;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:16px;top:8px;z-index:5;background:#fff;color:var(--navy);padding:8px 12px;border:2px solid var(--navy);font-weight:bold}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
  header h1{text-align:center}
  .home{justify-self:start}
  h1{margin:0;background:var(--navy);color:#fff;padding:8px 18px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:0;outline-offset:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tools button,.btn{font:inherit;font-size:14px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tools button:hover,.btn:hover{border-color:var(--navy)}
  #save{background:var(--navy);color:#fff;border-color:var(--navy)}
  .menu{position:relative}
  .menu summary{list-style:none}
  .menu summary::-webkit-details-marker{display:none}
  .menu summary::after{content:"\25BE";content:"\25BE" / "";margin-left:6px}
  .menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:flex;flex-direction:column;min-width:230px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .tools .menu-list button{border:none;width:100%}
  .tools .menu-list button:hover{background:#eef1f6}
  .tools #clear{margin-left:12px;color:#9b1c1c;border-color:#d9a8a8}
  .tools #clear:hover{border-color:#9b1c1c;background:#fdf2f2}
  .home{gap:8px;font-weight:bold;color:var(--navy);border-color:var(--navy)}
  #status{font-size:14px;color:var(--muted)}
  #status:empty{display:none}
  .hint{font-size:14px;color:var(--muted);margin:0 auto 14px;max-width:80ch;text-align:center}
  @media (max-width:900px){header{grid-template-columns:1fr}header>*{justify-self:start}.tools{justify-content:flex-start}.menu-list{right:auto;left:0}.hint{text-align:left;margin-left:0}}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  .grid:focus{outline:none}
  section,.overview{background:#fff;padding:10px;border:1px solid #ddd;border-top:5px solid var(--c);overflow-x:auto}
  h2{text-align:center;margin:4px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--c)}
  .dates{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;table-layout:fixed;font-size:13px}
  th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
  td{scroll-margin-top:60px}
  thead th{font-size:14px}
  thead th small{display:block;font-weight:normal;font-size:12px}
  .hol{display:block;font-size:12px;font-weight:normal}
  .tag{display:block;font-size:12px;font-weight:bold}
  .t1{--c:#2a5f9e;--l:#dce8f6}.t2{--c:#2e7d32;--l:#dcefdb}.t3{--c:#a8532a;--l:#f6e1d5}.t4{--c:#7e3f84;--l:#efdff0}
  .term thead th{background:var(--c);color:#fff}
  .term thead th.grey{background:#5f666d}
  td{background:#fff}
  td.grey{background:#e1e3e5;color:#4a5057}
  /* week topic leads the column */
  .wn{min-height:26px;font-family:var(--serif);font-size:15px;line-height:1.25;font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none;word-wrap:break-word}
  .wn:empty::before{content:var(--wnl,"Notes / CAT");color:var(--ph);font-weight:normal}
  .updated{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .wn.cat,.wn.dev{font-family:var(--sans);line-height:1.3;background:var(--navy);color:#fff;border:none;border-radius:3px;padding:4px 5px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .wn.cat:empty::before,.wn.dev:empty::before{content:none}
  .ck{display:block;font-size:12px;font-weight:normal;opacity:.9}
  .ct{display:block;font-size:13.5px}
  .les{margin-top:3px}
  .lh{cursor:pointer;background:#fff;padding:5px 7px;font-weight:bold;border:1px solid var(--line);border-left:4px solid var(--line);user-select:none;font-size:13.5px}
  .lt{font-weight:normal}
  /* clickable bars respond on hover */
  .lh:hover{background:#eef1f6}
  .cch:hover{background:rgba(0,0,0,.12)}
  .wn.cat:hover,.wn.dev:hover{background:#2c3f6b}
  .wn.dev{background:#0f6e6a}
  .wn.dev:hover{background:#15807b}
  .lh::before,.cch::before{content:"\25B8  ";content:"\25B8  " / ""}
  .les.open .lh::before,.ccw.open .cch::before{content:"\25BE  ";content:"\25BE  " / ""}
  /* lessons with content get the term colour on their edge */
  .les.filled .lh{border-left-color:var(--c)}
  td.grey .les.filled .lh{border-left-color:#5f666d}
  /* collapsible panels use hidden="until-found" so Ctrl+F can find and open them */
  .lb,.codes,.info{display:block}
  .lb[hidden],.codes[hidden],.info[hidden]{display:none}
  .uf .lb[hidden],.uf .codes[hidden],.uf .info[hidden]{display:block;min-height:0;padding:0;border:0;margin:0}
  .lb{min-height:50px;padding:4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word}
  .fl{font-size:12px;font-weight:bold;color:var(--muted);margin:6px 0 1px}
  .cpall{margin:8px 0 2px;text-align:right}
  .cp{font:inherit;font-size:13px;min-height:30px;padding:4px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
  .cp:hover{border-color:var(--navy)}
  .cp.done{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fld{min-height:22px;padding:2px 4px;border-bottom:1px dotted #6b7680;outline:none;word-wrap:break-word;font-size:13.5px}
  .fld ul{margin:0;padding-left:16px}
  .fld li+li{margin-top:2px}
  .fld:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .fld:focus,.codes:focus{background:#fffbe6}
  .info{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 6px;margin:0 0 6px;font-size:13px;outline:none;word-wrap:break-word}
  .info:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .ccw{margin:0 0 4px}
  .cch{cursor:pointer;font-size:12px;font-weight:bold;color:#2d3748;background:rgba(0,0,0,.06);border:1px solid var(--line);padding:3px 7px;user-select:none}
  .codes{font-size:12px;color:#2d3748;padding:3px 4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word;outline:none}
  .codes:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  :focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .wn.cat:focus-visible,.wn.dev:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
  .wn:focus,.info:focus{outline:2px solid var(--navy)}
  /* live site is read-only (body.ro): .ed = editing only, .rd = read-only only */
  body.ro .ed,body:not(.ro) .rd{display:none!important}
  body.ro .wn:empty::before,body.ro .fld:empty::before,body.ro .info:empty::before,body.ro .codes:empty::before{content:none}
  body.ro .ccw:has(.codes:empty){display:none}
  body.ro .info:empty{display:none!important}
  .wn.cat,.wn.dev{padding:5px 6px}
  .dvb{font-family:var(--sans);line-height:1.3;background:#0f6e6a;color:#fff;border-radius:3px;padding:4px 5px;margin-bottom:6px;font-size:12px}
  /* this week */
  th.now,td.now{box-shadow:inset 0 0 0 3px var(--now)}
  td.now{background:#fff8dc}
  th.now .tag{display:inline-block;background:var(--navy);border-radius:3px;padding:1px 6px;margin-top:3px}
  /* term jump links */
  .jump{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
  .jump a{color:#fff;background:var(--c);min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:14px}
  .jump a.nowlink{--c:var(--navy)}
  section{scroll-margin-top:60px}
  /* assessments at a glance (collapsible) */
  .overview{--c:var(--navy)}
  .overview summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0;border-radius:4px}
  .overview summary::-webkit-details-marker{display:none}
  .overview summary h2{margin:0;color:var(--navy)}
  .overview summary::before{content:"\25B8";content:"\25B8" / "";color:var(--navy);font-size:16px;transition:transform .15s}
  .overview[open] summary::before{transform:rotate(90deg)}
  .overview .count{font-size:13px;font-weight:bold;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px}
  .overview .more{font-size:13px;color:var(--muted)}
  .overview .more::after{content:"Show"}
  .overview[open] .more::after{content:"Hide"}
  .overview summary:hover h2{text-decoration:underline}
  .overview table{width:100%;table-layout:auto;margin-top:8px}
  .overview th{background:var(--navy);color:#fff;text-align:left;font-size:13px}
  .overview td{background:#fff;padding:6px}
  .overview td:first-child{white-space:nowrap}
  .overview td small{display:block;color:var(--muted)}
  .overview .ck{color:var(--muted);opacity:1}
  .overview a{color:var(--navy);font-weight:bold}
  /* plan search */
  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .search input{font:inherit;font-size:14px;min-height:36px;width:260px;padding:6px 10px;border:1px solid #6b7680;border-radius:4px;background:#fff}
  .search button{font:inherit;font-size:14px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
  #qcount{font-size:13px;color:var(--muted)}
  td.dim{opacity:.4}
  .hit{box-shadow:0 0 0 2px #e0a800}
  .hit.cur{box-shadow:0 0 0 3px var(--navy)}
  ::highlight(search){background:#ffe066;color:#1f2933}
  @media (prefers-reduced-motion:reduce){.overview summary::before{transition:none}}
  /* unit plan (Word) picker */
  .units{max-width:min(680px,calc(100vw - 32px));border:none;border-radius:8px;padding:20px 24px;color:var(--ink)}
  .units::backdrop{background:rgba(0,0,0,.45)}
  .units h2{margin:0 0 4px;color:var(--navy)}
  .units p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .units ul{list-style:none;margin:0 0 16px;padding:0}
  .units li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #e3e6ea}
  .units li span{flex:1}.units small{display:block;color:var(--muted)}
  /* bigger targets on touch screens */
  @media (pointer:coarse){.lh,.cch{min-height:40px;display:flex;align-items:center}.cp{min-height:44px}.jump a,.tools button,.btn{min-height:44px}}
  /* phones: weeks stack vertically instead of scrolling sideways */
  @media (max-width:640px){
    body{padding:12px}
    .term table{display:flex;flex-direction:column;width:100%!important;min-width:0!important}
    .term thead,.term tbody,.term tr{display:contents}
    .term th{order:calc(var(--o) * 2 - 1);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;text-align:left;margin-top:10px}
    .term th small,.term th .hol,.term th .tag{display:inline}
    .term td{order:calc(var(--o) * 2);border-top:none}
    .overview td:first-child{white-space:normal}
    .search{margin-left:0;width:100%}.search input{flex:1;width:auto}
    section,td{scroll-margin-top:120px}
    header,header>*,.jump,.tools,.search{min-width:0;max-width:100%}
    .tools{flex-wrap:wrap;justify-content:flex-start}
    .tools>*{flex:0 1 auto}
    .jump{flex-wrap:wrap;justify-content:flex-start}
    .jump>*{flex:0 0 auto}
  }
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .tools,.hint,.jump,.home,.skip{display:none}
    header{grid-template-columns:1fr}
    th.now,td.now,.hit{box-shadow:none}
    td.now{background:#fff}
    td.dim{opacity:1}
    .overview .more,.overview summary::before{display:none}
    .grid{gap:8px}
    section,.overview{border:none;border-top:4px solid var(--c)}
    section+section{break-before:page}
    .lb,.lb[hidden]{display:block!important;content-visibility:visible!important;min-height:30px!important;padding:4px!important;border:1px solid var(--line)!important;border-top:none!important}
    .lh::before,.cch::before,.wn:empty::before,.fld:empty::before{content:""}
    .cpall{display:none}
    .codes:not(:empty),.wn.cat + .info:not(:empty){display:block!important;content-visibility:visible!important;padding:3px 4px!important;border:1px solid var(--line)!important;margin:0 0 4px!important}
    .ccw:has(.codes:empty){display:none}
    .fld ul{padding:0;list-style:none}.fld li{display:inline}.fld li+li::before{content:" | "}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* "Print CATs and topics": weekly topics and CATs only */
    body.summary .les,body.summary .ccw{display:none!important}
    body.summary .wn{border-bottom:none}
  }
</style>

<a class="skip" href="#grid">Skip to the plan</a>
<header>
  <a class="home btn" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>All plans</a>
  <h1 contenteditable="true">EN12 Curriculum Plan 2027</h1>
  <p class="updated" id="updated"></p>
  <div class="tools">
    <span id="status" aria-live="polite"></span>
    <button id="expand">Expand all</button>
    <button id="save" class="ed">Save</button>
    <details class="menu"><summary class="btn">Print &amp; download</summary><div class="menu-list">
      <button onclick="printPlan('full')" title="Every lesson with learning intentions, success criteria and Do now. Print or save as PDF.">Print full plan</button>
      <button onclick="printPlan('summary')" title="Weekly topics and CATs only. Print or save as PDF.">Print CATs and topics</button>
      <button id="cmbtn" title="Download each semester as a Word curriculum map, in the school's template layout">Curriculum map (Word)</button>
      <button id="upv2btn" title="Download a unit of work (first lesson to CAT) in the school's unit plan template">Unit plans (Word)</button>
    </div></details>
    <button id="clear" class="ed">Clear all</button>
  </div>
</header>
<p class="hint"><span class="ed">Click a lesson to open it, then type. Press Save (or Ctrl+S) to save your changes.</span><span class="rd">Click a lesson, assessment or curriculum codes to see the details.</span> Prints on A3 landscape.</p>
<main class="grid" id="grid" tabindex="-1"></main>
<script>
const TERMS=[
 {n:1,start:"2027-01-25",weeks:9,label:"Wed 27 Jan – Thu 25 Mar (students start Thu 28 Jan)",
  notes:{1:"Starts Wed",7:"Labour Day Mon",9:"Ends Thu (Good Fri)"},grey:{},hol:[7,9]},
 {n:2,start:"2027-04-12",weeks:11,label:"Mon 12 Apr – Fri 25 Jun",
  notes:{10:"King's Bday Mon"},grey:{9:"Exams",11:"Set-Up"},hol:[10],noLessons:[9],exam:[9]},
 {n:3,start:"2027-07-12",weeks:10,label:"Mon 12 Jul – Fri 17 Sep",notes:{},grey:{},hol:[]},
 {n:4,start:"2027-10-04",weeks:11,label:"Mon 4 Oct – Fri 17 Dec",
  notes:{5:"Cup Day Tue"},grey:{6:"Exams",8:"Step-Up",9:"Step-Up",10:"Activities Week",11:"Clean-Up Week"},hol:[5],noLessons:[6,8,9,10,11],exam:[6]}
];
// Per-plan calendar changes, e.g. {"normalWeeks":[[2,9]]} makes Term 2 Week 9 a normal teaching week for that plan.
const PLAN={"normalWeeks": [[2, 11]], "greyWeeks": [[4, 8, "Retreat and HeadStart"], [4, 9, "HeadStart"]], "assessWord": "SAC", "devBanner": [[1, 4, "Developmental task: analytical response to The Castle (practice SAC)"], [1, 7, "Developmental task: analytical response to The Castle (second practice)"], [2, 4, "Developmental task: creating a text, with reflective commentary in the same week"], [3, 6, "Developmental task: exploring argument (practice SAC)"], [4, 1, "Developmental task: reading and exploring texts (practice SAC)"]], "updated": "2026-11-13"};
// Assessment word on the page: "CAT" by default, "SAC" for Year 12 (set by PLAN.assessWord)
const ASSESS=PLAN.assessWord||"CAT";
{const up=document.getElementById("updated");if(up&&PLAN.updated){const d=new Date(PLAN.updated+"T00:00");up.textContent="Last updated "+d.toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});}}
document.documentElement.style.setProperty("--wnl",JSON.stringify("Notes / "+ASSESS));
{const b=document.querySelector('button[onclick="printPlan(\'summary\')"]');if(b){b.textContent="Print "+ASSESS+"s and topics";b.title="Weekly topics and "+ASSESS+"s only. Print or save as PDF.";}const u=document.getElementById("upv2btn");if(u)u.title="Download a unit of work (first lesson to "+ASSESS+") in the school's unit plan template";}
(PLAN.normalWeeks||[]).forEach(([n,w])=>{const t=TERMS.find(x=>x.n===n);delete t.grey[w];t.noLessons=(t.noLessons||[]).filter(x=>x!==w);t.exam=(t.exam||[]).filter(x=>x!==w);});
(PLAN.notes||[]).forEach(([n,w,l])=>{const t=TERMS.find(x=>x.n===n);t.notes=t.notes||{};t.notes[w]=l;}); // e.g. [[2,11,"Step-Up"]] labels a week
(PLAN.greyWeeks||[]).forEach(([n,w,l])=>{const t=TERMS.find(x=>x.n===n);t.grey[w]=l;t.noLessons=(t.noLessons||[]).concat([w]);t.exam=(t.exam||[]).filter(x=>x!==w);}); // e.g. [[1,1,"Induction"]] greys out a week with no lessons

// Search: highlights matches, opens the lessons they're in, fades other weeks. Display only.
(()=>{
  const q=document.getElementById("q"),cnt=document.getElementById("qcount"),next=document.getElementById("qnext");
  const HL=window.CSS&&CSS.highlights&&window.Highlight;
  let hits=[],cur=-1,opened=[],timer;
  function clear(){
    opened.forEach(([b,p])=>setOpen(b,p,false));opened=[];
    document.querySelectorAll(".hit,.dim").forEach(e=>e.classList.remove("hit","cur","dim"));
    if(HL)CSS.highlights.delete("search");
    hits=[];cur=-1;next.hidden=true;cnt.textContent="";
  }
  function open(b,p){if(p.hidden){setOpen(b,p,true);opened.push([b,p]);}}
  function run(){
    clear();
    const term=q.value.trim().toLowerCase();
    if(term.length<2)return;
    const ranges=[];let weeks=0;
    document.querySelectorAll(".term td").forEach(td=>{
      let found=false;
      td.querySelectorAll(".wn,.info,.codes,.lh,.fld").forEach(el=>{
        if(!el.textContent.toLowerCase().includes(term))return;
        found=true;
        const les=el.closest(".les");
        if(les){const b=les.querySelector(".lh");open(b,b.nextElementSibling);}
        else if(el.classList.contains("codes"))open(el.previousElementSibling,el);
        else if(el.classList.contains("info")&&el.previousElementSibling.classList.contains("cat"))open(el.previousElementSibling,el);
        const box=les||el;if(!hits.includes(box)){hits.push(box);box.classList.add("hit");}
        if(HL){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
          while((n=tw.nextNode())){const s=n.data.toLowerCase();let i=s.indexOf(term);
            while(i>-1){const r=new Range();r.setStart(n,i);r.setEnd(n,i+term.length);ranges.push(r);i=s.indexOf(term,i+term.length);}}}
      });
      if(found)weeks++;else td.classList.add("dim");
    });
    if(HL&&ranges.length)CSS.highlights.set("search",new Highlight(...ranges));
    cnt.textContent=hits.length?`${hits.length} match${hits.length>1?"es":""} in ${weeks} week${weeks>1?"s":""}`:"No matches. Check the spelling or try a shorter word.";
    next.hidden=!hits.length;
  }
  function go(){
    if(!hits.length)return;
    if(cur>-1)hits[cur].classList.remove("cur");
    cur=(cur+1)%hits.length;hits[cur].classList.add("cur");
    hits[cur].scrollIntoView({block:"center",inline:"center"});
    if(hits.length>1)cnt.textContent=`Match ${cur+1} of ${hits.length}`;
  }
  q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,150);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);if(!hits.length)run();go();}if(e.key==="Escape"){q.value="";clear();}});
  next.addEventListener("click",go);
})();

// Build the file text: original page with the current entries written into SAVED
function fileText(){
  const c=document.documentElement.cloneNode(true);
  c.removeAttribute("class");
  c.querySelector("#grid").innerHTML="";
  c.querySelector("#status").textContent="";
  // \u2028/\u2029 would break the line match below and "<" could end the script early; escaping keeps the data identical
  const data=JSON.stringify(store).replace(/[<\u2028\u2029]/g,ch=>"\\u"+ch.charCodeAt(0).toString(16).padStart(4,"0"));
  const html="<!doctype html>\n"+c.outerHTML;
  let found=false;
  const out=html.replace(/const SAVED=.*;\n/, ()=>{found=true;return "const SAVED="+data+";\n";});
  if(!found)throw new Error("SAVED line not found");
  return out;
}
async function save(){
  if(LIVE)return;
  let text;
  try{text=fileText();}catch(e){setStatus("Not saved: this file's data line is missing. Your changes are still on screen.");return;}
  if(window.showSaveFilePicker){
    try{
      if(!handle)handle=await window.showSaveFilePicker({suggestedName:document.title+".html",
        types:[{description:"HTML file",accept:{"text/html":[".html"]}}]});
      const w=await handle.createWritable();
      await w.write(text);
      await w.close();
      dirty=false;
      setStatus("Saved at "+new Date().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit"}));
      return;
    }catch(e){
      if(e.name==="AbortError")return;
      handle=null;
    }
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/html"}));
  a.download=document.title+".html";
  a.click();
  dirty=false;
  setStatus("Downloaded – replace the file in your folder with it");
}

// Unit plans: a unit runs from the first week after the previous assessment to its CAT. Exams have no unit plan.
// Exported as a Word curriculum map in the school's format. Read-only: works on the live site too.
function units(){
  const out=[];let cur=[];
  TERMS.forEach(t=>{for(let w=1;w<=t.weeks;w++){
    if(((t.noLessons||[]).includes(w)||t.grey[w])&&!(t.exam||[]).includes(w))continue; // Set-Up, Step-Up and so on (grey weeks are not teaching weeks)
    if((PLAN.noUnit||[]).some(([n,x])=>n===t.n&&x===w))continue; // in the plan's lessons, but not part of any unit (e.g. post-exam week)
    const k=`${t.n}--${w}`;
    cur.push({t:t.n,w,k,lessons:lessonNames(t,w)});
    const v=(store[k]||"").trim();
    if(CAT.test(v)){if(!v.startsWith("EXAM"))out.push(cur);cur=[];} // exam revision weeks get no unit plan
  }});
  return out; // weeks after the last assessment have no CAT, so they form no unit
}

// Minimal zip (stored, no compression): all a .docx needs
function zip(files){
  const enc=new TextEncoder(),local=[],central=[];let off=0;
  const T=[...Array(256)].map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0;});
  const le=(...f)=>{const b=new Uint8Array(f.reduce((s,x)=>s+x[1],0)),v=new DataView(b.buffer);let i=0;for(const [x,n] of f){n===2?v.setUint16(i,x,true):v.setUint32(i,x,true);i+=n;}return b;};
  for(const [name,text] of Object.entries(files)){
    const nm=enc.encode(name),d=enc.encode(text);let c=~0;for(const b of d)c=T[(c^b)&255]^(c>>>8);c=~c>>>0;
    const common=[[20,2],[0,2],[0,2],[0,2],[33,2],[c,4],[d.length,4],[d.length,4],[nm.length,2],[0,2]];
    local.push(le([0x04034b50,4],...common),nm,d);
    central.push(le([0x02014b50,4],[20,2],...common,[0,2],[0,2],[0,2],[0,4],[off,4]),nm);
    off+=30+nm.length+d.length;
  }
  const size=central.reduce((s,b)=>s+b.length,0), n=Object.keys(files).length;
  return new Blob([...local,...central,le([0x06054b50,4],[0,2],[0,2],[n,2],[n,2],[size,4],[off,4],[0,2])],{type:CT_DOCX});
}

const kkFromLI=li=>{

    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}
document.getElementById("upv2btn").onclick=()=>{
  const us=units(), dl=document.createElement("dialog");dl.className="units";dl.setAttribute("aria-labelledby","up2h");
  dl.innerHTML=`<h2 id="up2h">Unit plans</h2><p>Each unit runs from its first lesson to its ${ASSESS}.</p>`+
    (us.length?`<ul>${us.map((u,i)=>`<li><span><b>${esc(unitName(u))}</b><small>${unitSpan(u)}</small></span><button type="button" class="btn" data-i="${i}">Download .docx</button></li>`).join("")}</ul>`:"<p>No "+ASSESS+"s in this plan yet.</p>")+
    `<form method="dialog"><button class="btn">Close</button></form>`;
  dl.addEventListener("click",e=>{
    if(e.target===dl)return dl.close();
    const b=e.target.closest("[data-i]");if(!b)return;
    const u=us[b.dataset.i], a=document.createElement("a"), url=URL.createObjectURL(unitDocxV2(u));
    a.href=url;a.download=`${document.title.split(" ")[0]} Unit Plan - ${fileSafe(unitName(u))}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  dl.addEventListener("close",()=>dl.remove());
  document.body.appendChild(dl);dl.showModal();
};

</script>
</body>
</html>
