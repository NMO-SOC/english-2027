<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07EN Curriculum Plan 2027</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2933;--line:#9aa5b1;--bg:#f7f7f5;--navy:#1d2b4f;--muted:#4a5562;--ph:#5b6570;--now:#a87400;
    --sans:"Atkinson Hyperlegible",Arial,Helvetica,sans-serif;--serif:"Source Serif 4",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;font-family:var(--sans);color:var(--ink);background:var(--bg)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:16px;top:8px;z-index:5;background:#fff;color:var(--navy);padding:8px 12px;border:2px solid var(--navy);font-weight:bold}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:12px}
  header h1{text-align:center}
  .home{justify-self:start}
  h1{margin:0;background:var(--navy);color:#fff;padding:8px 18px;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:0;outline-offset:3px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .tools button,.btn{font:inherit;font-size:14px;min-height:36px;padding:7px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .tools button:hover,.btn:hover{border-color:var(--navy)}
  #save{background:var(--navy);color:#fff;border-color:var(--navy)}
  .menu{position:relative}
  .menu summary{list-style:none}
  .menu summary::-webkit-details-marker{display:none}
  .menu summary::after{content:"\25BE";content:"\25BE" / "";margin-left:6px}
  .menu-list{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:flex;flex-direction:column;min-width:230px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .tools .menu-list button{border:none;width:100%}
  .tools .menu-list button:hover{background:#eef1f6}
  .tools #clear{margin-left:12px;color:#9b1c1c;border-color:#d9a8a8}
  .tools #clear:hover{border-color:#9b1c1c;background:#fdf2f2}
  .home{gap:8px;font-weight:bold;color:var(--navy);border-color:var(--navy)}
  #status{font-size:14px;color:var(--muted)}
  #status:empty{display:none}
  .hint{font-size:14px;color:var(--muted);margin:0 auto 14px;max-width:80ch;text-align:center}
  @media (max-width:900px){header{grid-template-columns:1fr}header>*{justify-self:start}.tools{justify-content:flex-start}.menu-list{right:auto;left:0}.hint{text-align:left;margin-left:0}}
  .grid{display:grid;grid-template-columns:1fr;gap:20px}
  .grid:focus{outline:none}
  section,.overview{background:#fff;padding:10px;border:1px solid #ddd;border-top:5px solid var(--c);overflow-x:auto}
  h2{text-align:center;margin:4px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--c)}
  .dates{text-align:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  table{border-collapse:collapse;table-layout:fixed;font-size:13px}
  th,td{border:1px solid var(--line);padding:4px;vertical-align:top}
  td{scroll-margin-top:60px}
  thead th{font-size:14px}
  thead th small{display:block;font-weight:normal;font-size:12px}
  .hol{display:block;font-size:12px;font-weight:normal}
  .tag{display:block;font-size:12px;font-weight:bold}
  .t1{--c:#2a5f9e;--l:#dce8f6}.t2{--c:#2e7d32;--l:#dcefdb}.t3{--c:#a8532a;--l:#f6e1d5}.t4{--c:#7e3f84;--l:#efdff0}
  .term thead th{background:var(--c);color:#fff}
  .term thead th.grey{background:#5f666d}
  td{background:#fff}
  td.grey{background:#e1e3e5;color:#4a5057}
  /* week topic leads the column */
  .wn{min-height:26px;font-family:var(--serif);font-size:15px;line-height:1.25;font-weight:bold;border-bottom:1px solid var(--line);margin-bottom:4px;outline:none;word-wrap:break-word}
  .wn:empty::before{content:var(--wnl,"Notes / CAT");color:var(--ph);font-weight:normal}
  .wn.cat,.wn.dev{font-family:var(--sans);line-height:1.3;background:var(--navy);color:#fff;border:none;border-radius:3px;padding:4px 5px;margin-bottom:6px;font-size:12px;cursor:pointer}
  .wn.cat:empty::before,.wn.dev:empty::before{content:none}
  .ck{display:block;font-size:12px;font-weight:normal;opacity:.9}
  .ct{display:block;font-size:13.5px}
  .les{margin-top:3px}
  .lh{cursor:pointer;background:#fff;padding:5px 7px;font-weight:bold;border:1px solid var(--line);border-left:4px solid var(--line);user-select:none;font-size:13.5px}
  .lt{font-weight:normal}
  /* clickable bars respond on hover */
  .lh:hover{background:#eef1f6}
  .cch:hover{background:rgba(0,0,0,.12)}
  .wn.cat:hover,.wn.dev:hover{background:#2c3f6b}
  .wn.dev{background:#0f6e6a}
  .wn.dev:hover{background:#15807b}
  .lh::before,.cch::before{content:"\25B8  ";content:"\25B8  " / ""}
  .les.open .lh::before,.ccw.open .cch::before{content:"\25BE  ";content:"\25BE  " / ""}
  /* lessons with content get the term colour on their edge */
  .les.filled .lh{border-left-color:var(--c)}
  td.grey .les.filled .lh{border-left-color:#5f666d}
  /* collapsible panels use hidden="until-found" so Ctrl+F can find and open them */
  .lb,.codes,.info{display:block}
  .lb[hidden],.codes[hidden],.info[hidden]{display:none}
  .uf .lb[hidden],.uf .codes[hidden],.uf .info[hidden]{display:block;min-height:0;padding:0;border:0;margin:0}
  .lb{min-height:50px;padding:4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word}
  .fl{font-size:12px;font-weight:bold;color:var(--muted);margin:6px 0 1px}
  .cpall{margin:8px 0 2px;text-align:right}
  .cp{font:inherit;font-size:13px;min-height:30px;padding:4px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:3px;cursor:pointer}
  .cp:hover{border-color:var(--navy)}
  .cp.done{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fld{min-height:22px;padding:2px 4px;border-bottom:1px dotted #6b7680;outline:none;word-wrap:break-word;font-size:13.5px}
  .fld ul{margin:0;padding-left:16px}
  .fld li+li{margin-top:2px}
  .fld:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .fld:focus,.codes:focus{background:#fffbe6}
  .info{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 6px;margin:0 0 6px;font-size:13px;outline:none;word-wrap:break-word}
  .info:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  .ccw{margin:0 0 4px}
  .cch{cursor:pointer;font-size:12px;font-weight:bold;color:#2d3748;background:rgba(0,0,0,.06);border:1px solid var(--line);padding:3px 7px;user-select:none}
  .codes{font-size:12px;color:#2d3748;padding:3px 4px;border:1px solid var(--line);border-top:none;background:#fff;word-wrap:break-word;outline:none}
  .codes:empty::before{content:attr(data-ph);color:var(--ph);font-style:italic}
  :focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .wn.cat:focus-visible,.wn.dev:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
  .wn:focus,.info:focus{outline:2px solid var(--navy)}
  /* live site is read-only (body.ro): .ed = editing only, .rd = read-only only */
  body.ro .ed,body:not(.ro) .rd{display:none!important}
  body.ro .wn:empty::before,body.ro .fld:empty::before,body.ro .info:empty::before,body.ro .codes:empty::before{content:none}
  body.ro .ccw:has(.codes:empty){display:none}
  body.ro .info:empty{display:none!important}
  .wn.cat,.wn.dev{padding:5px 6px}
  /* this week */
  th.now,td.now{box-shadow:inset 0 0 0 3px var(--now)}
  td.now{background:#fff8dc}
  th.now .tag{display:inline-block;background:var(--navy);border-radius:3px;padding:1px 6px;margin-top:3px}
  /* term jump links */
  .jump{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
  .jump a{color:#fff;background:var(--c);min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:4px;text-decoration:none;font-weight:bold;font-size:14px}
  .jump a.nowlink{--c:var(--navy)}
  section{scroll-margin-top:60px}
  /* assessments at a glance (collapsible) */
  .overview{--c:var(--navy)}
  .overview summary{list-style:none;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;padding:2px 0;border-radius:4px}
  .overview summary::-webkit-details-marker{display:none}
  .overview summary h2{margin:0;color:var(--navy)}
  .overview summary::before{content:"\25B8";content:"\25B8" / "";color:var(--navy);font-size:16px;transition:transform .15s}
  .overview[open] summary::before{transform:rotate(90deg)}
  .overview .count{font-size:13px;font-weight:bold;color:#fff;background:var(--navy);border-radius:999px;padding:2px 9px}
  .overview .more{font-size:13px;color:var(--muted)}
  .overview .more::after{content:"Show"}
  .overview[open] .more::after{content:"Hide"}
  .overview summary:hover h2{text-decoration:underline}
  .overview table{width:100%;table-layout:auto;margin-top:8px}
  .overview th{background:var(--navy);color:#fff;text-align:left;font-size:13px}
  .overview td{background:#fff;padding:6px}
  .overview td:first-child{white-space:nowrap}
  .overview td small{display:block;color:var(--muted)}
  .overview .ck{color:var(--muted);opacity:1}
  .overview a{color:var(--navy);font-weight:bold}
  /* plan search */
  .search{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .search input{font:inherit;font-size:14px;min-height:36px;width:260px;padding:6px 10px;border:1px solid #6b7680;border-radius:4px;background:#fff}
  .search button{font:inherit;font-size:14px;min-height:36px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer}
  #qcount{font-size:13px;color:var(--muted)}
  td.dim{opacity:.4}
  .hit{box-shadow:0 0 0 2px #e0a800}
  .hit.cur{box-shadow:0 0 0 3px var(--navy)}
  ::highlight(search){background:#ffe066;color:#1f2933}
  @media (prefers-reduced-motion:reduce){.overview summary::before{transition:none}}
  /* unit plan (Word) picker */
  .units{max-width:min(680px,calc(100vw - 32px));border:none;border-radius:8px;padding:20px 24px;color:var(--ink)}
  .units::backdrop{background:rgba(0,0,0,.45)}
  .units h2{margin:0 0 4px;color:var(--navy)}
  .units p{margin:0 0 12px;color:var(--muted);font-size:14px}
  .units ul{list-style:none;margin:0 0 16px;padding:0}
  .units li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #e3e6ea}
  .units li span{flex:1}.units small{display:block;color:var(--muted)}
  /* bigger targets on touch screens */
  @media (pointer:coarse){.lh,.cch{min-height:40px;display:flex;align-items:center}.cp{min-height:44px}.jump a,.tools button,.btn{min-height:44px}}
  /* phones: weeks stack vertically instead of scrolling sideways */
  @media (max-width:640px){
    body{padding:12px}
    .term table{display:flex;flex-direction:column;width:100%!important;min-width:0!important}
    .term thead,.term tbody,.term tr{display:contents}
    .term th{order:calc(var(--o) * 2 - 1);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;text-align:left;margin-top:10px}
    .term th small,.term th .hol,.term th .tag{display:inline}
    .term td{order:calc(var(--o) * 2);border-top:none}
    .overview td:first-child{white-space:normal}
    .search{margin-left:0;width:100%}.search input{flex:1;width:auto}
    section,td{scroll-margin-top:120px}
  }
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;padding:0}
    .tools,.hint,.jump,.home,.skip{display:none}
    header{grid-template-columns:1fr}
    th.now,td.now,.hit{box-shadow:none}
    td.now{background:#fff}
    td.dim{opacity:1}
    .overview .more,.overview summary::before{display:none}
    .grid{gap:8px}
    section,.overview{border:none;border-top:4px solid var(--c)}
    section+section{break-before:page}
    .lb,.lb[hidden]{display:block!important;content-visibility:visible!important;min-height:30px!important;padding:4px!important;border:1px solid var(--line)!important;border-top:none!important}
    .lh::before,.cch::before,.wn:empty::before,.fld:empty::before{content:""}
    .cpall{display:none}
    .codes:not(:empty),.wn.cat + .info:not(:empty){display:block!important;content-visibility:visible!important;padding:3px 4px!important;border:1px solid var(--line)!important;margin:0 0 4px!important}
    .ccw:has(.codes:empty){display:none}
    .fld ul{padding:0;list-style:none}.fld li{display:inline}.fld li+li::before{content:" | "}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    /* "Print CATs and topics": weekly topics and CATs only */
    body.summary .les,body.summary .ccw{display:none!important}
    body.summary .wn{border-bottom:none}
  }
</style>

 {n:3,start:"2027-07-12",weeks:10,label:"Mon 12 Jul – Fri 17 Sep",notes:{},grey:{},hol:[]},

const PLAN={"normalWeeks":[[2,9],[2,11]],"greyWeeks":[[1,1,"Induction"],[1,5,"Camp 24-26 Feb"]],"notes":[[1,2,"Starts Thu"]],"lessonCount":[[1,2,2]]};

const ASSESS=PLAN.assessWord||"CAT";
document.documentElement.style.setProperty("--wnl",JSON.stringify("Notes / "+ASSESS));
{const b=document.querySelector('button[onclick="printPlan(\'summary\')"]');if(b)b.textContent="Print "+ASSESS+"s and topics";}
(PLAN.normalWeeks||[]).forEach(([n,w])=>{const t=TERMS.find(x=>x.n===n);delete t.grey[w];t.noLessons=(t.noLessons||[]).filter(x=>x!==w);t.exam=(t.exam||[]).filter(x=>x!==w);});

, "1-6-3-sc": "I can name a friend. | I can explain their role. | I can use evidence.", "1-6-3-dn": "Name one friend and how they help Coraline.", "1-6-4-title": "Character check", "1-6-4-li": "We are learning to check our understanding of the characters.", "1-6-4-sc": "I can state a view about a character. | I can support it with evidence. | I can explain it.", "1-6-4-dn": "Write one view about a character with evidence.", "1--7": "Coraline: setting and atmosphere", "codes-1--7": "VC2E7LE03, VC2E7LY05", "1-7-1-title": "The house and the other world", "1-7-1-li": "We are learning how setting creates atmosphere.", "1-7-1-sc": "I can describe a setting. | I can explain its effect on the reader. | I can use evidence.", "1-7-1-dn": "Describe one setting and how it feels.", "1-7-2-title": "Mood and tone", "1-7-2-li": "We are learning to identify the mood and tone of the novel.", "1-7-2-sc": "I can name the mood. | I can find evidence. | I can explain its effect.", "1-7-2-dn": "Name the mood of one chapter.", "1-7-3-title": "Using imagery", "1-7-3-li": "We are learning to identify imagery in the novel.", "1-7-3-sc": "I can identify an image. | I can explain its effect. | I can use evidence.", "1-7-3-dn": "Find one image and say what it suggests.", "1-7-4-title": "Setting and meaning", "1-7-4-li": "We are learning to link setting to meaning.", "1-7-4-sc": "I can link a setting to an idea. | I can explain the link. | I can use evidence.", "1-7-4-dn": "Link one setting to one idea.", "1--8": "Coraline: literal and inferential questions", "codes-1--8": "VC2E7LY07, VC2E7LY05", "1-8-1-title": "Literal questions", "1-8-1-li": "We are learning to answer literal questions about the text.", "1-8-1-sc": "I can find information in the text. | I can answer in complete sentences. | I can use evidence.", "1-8-1-dn": "Answer one literal question about the first chapters.", "1-8-2-title": "Inferential questions", "1-8-2-li": "We are learning to answer inferential questions about the text.", "1-8-2-sc": "I can make an inference. | I can support it with evidence. | I can explain my thinking.", "1-8-2-dn": "Answer one inferential question about Coraline.", "1-8-3-title": "Answering with evidence", "1-8-3-li": "We are learning to use evidence when answering questions.", "1-8-3-sc": "I can choose evidence. | I can cite it. | I can explain how it answers the question.", "1-8-3-dn": "Choose one quote that answers a question.", "1-8-4-title": "Comprehension practice", "1-8-4-li": "We are learning to answer a set of comprehension questions.", "1-8-4-sc": "I can answer literal questions. | I can answer inferential questions. | I can use evidence.", "1-8-4-dn": "Answer one literal and one inferential question.", "1--9": "Coraline: themes", "codes-1--9": "VC2E7LE02, VC2E7LE04, VC2E7LY05", "1-9-1-title": "Identifying themes", "1-9-1-li": "We are learning to identify themes in Coraline.", "1-9-1-sc": "I can name a theme. | I can find evidence. | I can explain how it develops.", "1-9-1-dn": "Name one theme and one moment that shows it.", "1-9-2-title": "Family and belonging", "1-9-2-li": "We are learning to analyse family and belonging in the novel.", "1-9-2-sc": "I can describe a family relationship. | I can explain how it changes. | I can use evidence.", "1-9-2-dn": "Describe a family moment in the novel.", "1-9-3-title": "Choices and consequences", "1-9-3-li": "We are learning how choices in the novel have consequences.", "1-9-3-sc": "I can identify a choice. | I can explain its consequence. | I can use evidence.", "1-9-3-dn": "Name one choice Coraline makes and its consequence.", "1-9-4-title": "Theme check", "1-9-4-li": "We are learning to explain a theme with evidence.", "1-9-4-sc": "I can state a theme. | I can support it with evidence. | I can explain its meaning.", "1-9-4-dn": "Write one sentence about a theme.", "2--1": "Coraline: symbols and imagery", "codes-2--1": "VC2E7LA07, VC2E7LE03", "2-1-1-title": "Symbols", "2-1-1-li": "We are learning to identify symbols in Coraline.", "2-1-1-sc": "I can identify a symbol. | I can explain its meaning. | I can link it to a theme.", "2-1-1-dn": "Name one symbol and what it suggests.", "2-1-2-title": "Imagery and effect", "2-1-2-li": "We are learning how imagery affects the reader.", "2-1-2-sc": "I can identify imagery. | I can explain its effect. | I can use evidence.", "2-1-2-dn": "Find one image and explain its effect.", "2-1-3-title": "Visual features in the film", "2-1-3-li": "We are learning to compare the novel with the film.", "2-1-3-sc": "I can compare one scene. | I can explain a difference. | I can explain its effect.", "2-1-3-dn": "Compare one scene in the film and the novel.", "2-1-4-title": "Symbols and meaning", "2-1-4-li": "We are learning to link symbols to meaning.", "2-1-4-sc": "I can link a symbol to meaning. | I can explain the link. | I can use evidence.", "2-1-4-dn": "Link one symbol to one idea.", "2--2": "Coraline: plot and conflict", "codes-2--2": "VC2E7LE04, VC2E7LY07", "2-2-1-title": "Plot structure", "2-2-1-li": "We are learning to identify the parts of the plot.", "2-2-1-sc": "I can identify the start, middle and end. | I can explain the turning point. | I can use evidence.", "2-2-1-dn": "Name the turning point of the novel.", "2-2-2-title": "Conflict", "2-2-2-li": "We are learning to identify internal and external conflict.", "2-2-2-sc": "I can identify internal conflict. | I can identify external conflict. | I can explain its effect.", "2-2-2-dn": "Name one internal and one external conflict.", "2-2-3-title": "Summarising chapters", "2-2-3-li": "We are learning to summarise chapters.", "2-2-3-sc": "I can identify the key idea of a chapter. | I can write a summary. | I can leave out unnecessary detail.", "2-2-3-dn": "Summarise the last chapter in two sentences.", "2-2-4-title": "Ad libitum: reading check", "2-2-4-li": "We are learning to check our reading of the novel.", "2-2-4-sc": "I can answer a literal question. | I can answer an inferential question. | I can use evidence.", "2-2-4-dn": "Answer one literal and one inferential question.", "2--3": "S1_07EN_CAT2: Coraline: Comprehension Questions", "codes-2--3": "VC2E7LY07, VC2E7LE03, VC2E7LE04", "2-3-1-title": "CAT criteria", "2-3-1-li": "We are learning the criteria for the Coraline comprehension CAT.", "2-3-1-sc": "I can state the criteria. | I can check my plan. | I can choose my evidence.", "2-3-1-dn": "Tick each criterion.", "2-3-2-title": "Warm-up questions", "2-3-2-li": "We are learning to answer questions under time.", "2-3-2-sc": "I can answer within time. | I can use evidence. | I can explain my answers.", "2-3-2-dn": "Answer one question in five minutes.", "2-3-3-title": "Revision of the novel", "2-3-3-li": "We are learning to revise key events and characters.", "2-3-3-sc": "I can name key events. | I can name key characters. | I can explain their importance.", "2-3-3-dn": "Name three key events in order.", "2-3-4-title": "CAT: Coraline Comprehension Questions", "2-3-4-li": "We are learning to complete the Coraline comprehension CAT.", "2-3-4-sc": "I can complete the task in time. | I can use evidence. | I can explain my answers.", "2-3-4-dn": "Read the questions twice before you begin.", "2--4": "Introduction to persuasive writing", "codes-2--4": "VC2E7LA08, VC2E7LY01", "2-4-1-title": "Persuasive writing: prior knowledge", "2-4-1-li": "We are learning what we already know about persuasive writing.", "2-4-1-sc": "I can name one persuasive technique. | I can explain what a persuasive text does. | I can give an example.", "2-4-1-dn": "Name one persuasive technique you know.", "2-4-2-title": "Persuasion in everyday life", "2-4-2-li": "We are learning how persuasion appears in our daily lives.", "2-4-2-sc": "I can give two examples of persuasion. | I can name the audience for each. | I can explain the purpose.", "2-4-2-dn": "Name one place you see persuasion each day.", "2-4-3-title": "Introduction to persuasive writing", "2-4-3-li": "We are learning the requirements and purpose of persuasive writing.", "2-4-3-sc": "I can explain the purpose of persuasive writing. | I can name the parts of a persuasive piece. | I can write a brief persuasive opinion.", "2-4-3-dn": "Is the internet, including social media, good or bad for us? Give one reason.", "2-4-4-title": "Persuasion in advertising", "2-4-4-li": "We are learning how persuasive messages in advertisements are designed to influence decisions and opinions.", "2-4-4-sc": "I can explain how advertisements try to persuade people. | I can name an advertisement's target audience. | I can identify a hidden message in an advert.", "2-4-4-dn": "Describe an advertisement you have seen recently and what it wanted you to do.", "2--5": "Analysing visual features in advertisements", "codes-2--5": "VC2E7LA03, VC2E7LA07, VC2E7LY01", "2-5-1-title": "Visual features of print advertisements", "2-5-1-li": "We are learning to identify how advertisements use colour, size and salience to persuade target audiences.", "2-5-1-sc": "I can identify colour, size and salience in a print advertisement. | I can explain the intended effect of each on the target audience.", "2-5-1-dn": "Which colour in an advert catches your eye first, and why?", "2-5-2-title": "Writing analytical sentences", "2-5-2-li": "We are learning to write sentences that analyse how visual features persuade the target audience.", "2-5-2-sc": "I can write a sentence that names a visual feature. | I can explain its effect on the audience.", "2-5-2-dn": "Write one sentence about a visual feature you saw in an advert.", "2-5-3-title": "Metaphors in advertising", "2-5-3-li": "We are learning about metaphors and how they influence target audiences in an advertising campaign.", "2-5-3-sc": "I can identify a metaphor in an advert. | I can explain what it compares. | I can explain how it persuades.", "2-5-3-dn": "Finish the sentence: This product is like...", "2-5-4-title": "Personification in advertising", "2-5-4-li": "We are learning key terms to explain how personification shapes meaning in an advertising campaign.", "2-5-4-sc": "I can define personification. | I can identify it in an advert. | I can explain its effect on the reader.", "2-5-4-dn": "What human quality could a product be given in an advert?", "2--6": "Evidence and hyperbole in advertising", "codes-2--6": "VC2E7LA03, VC2E7LA08, VC2E7LY01", "2-6-1-title": "Evidence in advertisements", "2-6-1-li": "We are learning how advertisements use evidence to persuade.", "2-6-1-sc": "I can identify evidence in an advert. | I can explain why it persuades. | I can judge whether it is convincing.", "2-6-1-dn": "What evidence might an advert give to convince you to buy?", "2-6-2-title": "Hyperbole in advertisements", "2-6-2-li": "We are learning how hyperbole can persuade a target audience in a print advertisement.", "2-6-2-sc": "I can identify hyperbole. | I can explain its effect. | I can use the term hyperbole correctly.", "2-6-2-dn": "Name an exaggerated claim you have seen in an advert.", "2-6-3-title": "Planning the persuasive poster", "2-6-3-li": "We are learning to plan a persuasive poster for a target audience.", "2-6-3-sc": "I can name a target audience. | I can choose one persuasive technique. | I can sketch my layout.", "2-6-3-dn": "Name your product and its target audience.", "2-6-4-title": "Writing the poster text", "2-6-4-li": "We are learning to write persuasive poster text using the techniques from this unit.", "2-6-4-sc": "I can write a headline. | I can use one visual feature. | I can use one persuasive technique.", "2-6-4-dn": "Write a headline for your poster.", "2--7": "Designing the persuasive poster", "codes-2--7": "VC2E7LA07, VC2E7LY01, VC2E7LY08", "2-7-1-title": "Design and layout", "2-7-1-li": "We are learning to design a poster that uses visual features to persuade.", "2-7-1-sc": "I can use colour and size deliberately. | I can place the main message for salience. | I can check my poster against my plan.", "2- eader's understanding.", "2-10-2-sc": "I can identify the outer and inner stories. | I can explain how the storyteller influences the reader. | I can explain how the frame contributes to meaning.", "2-10-2-dn": "What is a framed narrative? Name the two parts.", "2-10-3-title": "Diagnostic paragraph", "2-10-3-li": "We are learning to show my current understanding of analytical paragraph writing.", "2-10-3-sc": "I can write a paragraph in complete sentences. | I can express an idea about a text. | I can support it with an example.", "2-10-3-dn": "What makes writing easy to understand?", "2-10-4-title": "Ad libitum: annotating the book", "2-10-4-li": "We are learning to annotate the novel for framing and character.", "2-10-4-sc": "I can annotate the frame. | I can annotate the inner story. | I can note one question.", "2-10-4-dn": "Find where the inner story begins.", "3--1": "Writing effective topic sentences", "codes-3--1": "VC2E7LA05, VC2E7LY06", "3-1-1-title": "Topic sentences in a mentor text", "3-1-1-li": "We are learning to use a mentor text to identify the purpose of a topic sentence.", "3-1-1-sc": "I can identify and explain the purpose of a topic sentence.", "3-1-1-dn": "Underline the topic sentence in a short paragraph.", "3-1-2-title": "Features of an effective topic sentence", "3-1-2-li": "We are learning to identify the features of an effective topic sentence.", "3-1-2-sc": "I can explain how a topic sentence introduces the writer's argument.", "3-1-2-dn": "What makes a topic sentence clear?", "3-1-3-title": "Writing topic sentences with a model", "3-1-3-li": "We are learning to write topic sentences using a mentor text as a model.", "3-1-3-sc": "I can write a topic sentence with guidance.", "3-1-3-dn": "Write a topic sentence using the model.", "3-1-4-title": "Writing topic sentences independently", "3-1-4-li": "We are learning to write effective topic sentences independently.", "3-1-4-sc": "I can independently write a topic sentence that answers the que // Search: highlights matches, opens the lessons they're in, fades other weeks. Display only.
(()=>{
  const q=document.getElementById("q"),cnt=document.getElementById("qcount"),next=document.getElementById("qnext");
  const HL=window.CSS&&CSS.highlights&&window.Highlight;
  let hits=[],cur=-1,opened=[],timer;
  function clear(){
    opened.forEach(([b,p])=>setOpen(b,p,false));opened=[];
    document.querySelectorAll(".hit,.dim").forEach(e=>e.classList.remove("hit","cur","dim"));
    if(HL)CSS.highlights.delete("search");
    hits=[];cur=-1;next.hidden=true;cnt.textContent="";
  }
  function open(b,p){if(p.hidden){setOpen(b,p,true);opened.push([b,p]);}}
  function run(){
    clear();
    const term=q.value.trim().toLowerCase();
    if(term.length<2)return;
    const ranges=[];let weeks=0;
    document.querySelectorAll(".term td").forEach(td=>{
      let found=false;
      td.querySelectorAll(".wn,.info,.codes,.lh,.fld").forEach(el=>{
        if(!el.textContent.toLowerCase().includes(term))return;
        found=true;
        const les=el.closest(".les");
        if(les){const b=les.querySelector(".lh");open(b,b.nextElementSibling);}
        else if(el.classList.contains("codes"))open(el.previousElementSibling,el);
        else if(el.classList.contains("info")&&el.previousElementSibling.classList.contains("cat"))open(el.previousElementSibling,el);
        const box=les||el;if(!hits.includes(box)){hits.push(box);box.classList.add("hit");}
        if(HL){const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
          while((n=tw.nextNode())){const s=n.data.toLowerCase();let i=s.indexOf(term);
            while(i>-1){const r=new Range();r.setStart(n,i);r.setEnd(n,i+term.length);ranges.push(r);i=s.indexOf(term,i+term.length);}}}
      });
      if(found)weeks++;else td.classList.add("dim");
    });
    if(HL&&ranges.length)CSS.highlights.set("search",new Highlight(...ranges));
    cnt.textContent=hits.length?`${hits.length} match${hits.length>1?"es":""} in ${weeks} week${weeks>1?"s":""}`:"No matches. Check the spelling or try a shorter word.";
    next.hidden=!hits.length;
  }
  function go(){
    if(!hits.length)return;
    if(cur>-1)hits[cur].classList.remove("cur");
    cur=(cur+1)%hits.length;hits[cur].classList.add("cur");
    hits[cur].scrollIntoView({block:"center",inline:"center"});
    if(hits.length>1)cnt.textContent=`Match ${cur+1} of ${hits.length}`;
  }
  q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,150);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(timer);if(!hits.length)run();go();}if(e.key==="Escape"){q.value="";clear();}});
  next.addEventListener("click",go);
})();

// Build the file text: original page with the current entries written into SAVED
function fileText(){
  const c=document.documentElement.cloneNode(true);
  c.removeAttribute("class");
  c.querySelector("#grid").innerHTML="";
  c.querySelector("#status").textContent="";
  // \u2028/\u2029 would break the line match below and "<" could end the script early; escaping keeps the data identical
  const data=JSON.stringify(store).replace(/[<\u2028\u2029]/g,ch=>"\\u"+ch.charCodeAt(0).toString(16).padStart(4,"0"));
  const html="<!doctype html>\n"+c.outerHTML;
  let found=false;
  const out=html.replace(/const SAVED=.*;\n/, ()=>{found=true;return "const SAVED="+data+";\n";});
  if(!found)throw new Error("SAVED line not found");
  return out;
}

function units(){
  const out=[];let cur=[];
  TERMS.forEach(t=>{for(let w=1;w<=t.weeks;w++){
    if(((t.noLessons||[]).includes(w)||t.grey[w])&&!(t.exam||[]).includes(w))continue; // Set-Up, Step-Up and so on (grey weeks are not teaching weeks)
    if((PLAN.noUnit||[]).some(([n,x])=>n===t.n&&x===w))continue; // in the plan's lessons, but not part of any unit (e.g. post-exam week)

// Minimal zip (stored, no compression): all a .docx needs
function zip(files){
  const enc=new TextEncoder(),local=[],central=[];let off=0;
  const T=[...Array(256)].map((_,n)=>{for(let k=0;k<8;k++)n=n&1?0xEDB88320^(n>>>1):n>>>1;return n>>>0;});
  const le=(...f)=>{const b=new Uint8Array(f.reduce((s,x)=>s+x[1],0)),v=new DataView(b.buffer);let i=0;for(const [x,n] of f){n===2?v.setUint16(i,x,true):v.setUint32(i,x,true);i+=n;}return b;};
  for(const [name,text] of Object.entries(files)){
    const nm=enc.encode(name),d=enc.encode(text);let c=~0;for(const b of d)c=T[(c^b)&255]^(c>>>8);c=~c>>>0;
    const common=[[20,2],[0,2],[0,2],[0,2],[33,2],[c,4],[d.length,4],[d.length,4],[nm.length,2],[0,2]];
    local.push(le([0x04034b50,4],...common),nm,d);
    central.push(le([0x02014b50,4],[20,2],...common,[0,2],[0,2],[0,2],[0,4],[off,4]),nm);
    off+=30+nm.length+d.length;
  }
  const size=central.reduce((s,b)=>s+b.length,0), n=Object.keys(files).length;
  return new Blob([...local,...central,le([0x06054b50,4],[0,2],[0,2],[n,2],[n,2],[size,4],[off,4],[0,2])],{type:CT_DOCX});
}

  const rowsXml=[]; let n=0;

  }});
  const tbl=`<w:tbl><w:tblPr><w:tblW w:w="${W.reduce((a,b)=>a+b)}" w:type="dxa"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="9AA5B1"/>`).join("")}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${W.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${header}${rowsXml.join("")}</w:tbl>`;
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', R="http://schemas.openxmlformats.org/officeDocument/2006/relationships", CT="application/vnd.openxmlformats-officedocument.wordprocessingml.";
  return zip({
    "[Content_Types].xml":X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CT}document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CT}styles+xml"/></Types>`,
    "_rels/.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/>${rels.join("")}</Relationships>`,
    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${P("Semester "+sem,true)}${P("KLA: English")}${P("Subject: "+subject)}${tbl}<w:p/><w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}

// Unit plans (Word): one document per unit of work, in the school's unit plan template.
// Tick boxes for cross-curriculum priorities, capabilities and 21CLD are chosen from the unit's own wording; the teacher should check them.
const UP2_CROSS=[
 ["Learning about Aboriginal and Torres Strait Islander histories and cultures",/aboriginal|torres|indigenous|first nations/],
 ["Learning about Sustainability",/sustainab|climate/],
 ["Learning about Asia and Australia's engagement with Asia",/asia|china|japan|korea|indonesia|vietnam/]];
const UP2_CAPS=[
 ["Ethical Capability",/ethic|justice|fair|moral|power|bias|responsib|rights/],
 ["Critical and Creative Thinking",/analys|argu|persua|creative|essay|evaluat|interpret|critic|imagin/],
 ["Intercultural Capability",/cultur|identity|m[aā]ori|asia|diverse|perspective|country/],
 ["Personal and Social Capability",/oral|present|debate|collab|group|team|peer|reflect|feedback|discuss|rehears/]];
const UP2_CLD=[
 ["Knowledge Construction",/analys|interpret|evidence|context|understand|theme|explore|explain/],
 ["Real world",/audience|persua|argu|pitch|letter|advert|media|news|public|community/],
 ["Collaboration",/collab|group|peer|team|discuss|debate|pair/],
 ["Self-regulation",/reflect|goal|plan|revis|draft|feedback|self|rehears|checklist/],
 ["Skillful Communication",/oral|present|write|writ|essay|speech|debate|communicat|letter|pitch/],
 ["ICT for learning",/film|digital|online|ict|slide|video|podcast|screen|media/]];
function unitDocxV2(u){
  const code=document.title.split(" ")[0], m=code.match(/^(\d+)(ADV)?EN/);
  const yearLevel=m?`Year ${+m[1]}${m[2]?" Advanced":""}`:code;
  const name=unitName(u);
  // Lesson plans sit beside the Unit Plan folder (../Lesson Plans/<file>), so the link resolves from there
  const lpRels=[], lpFolder=(CM_FOLDERS[code]||{})[name];
  const lpLine=lpFolder?`<w:p><w:pPr><w:spacing w:after="120"/></w:pPr><w:r><w:rPr><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">Lesson plans: </w:t></w:r><w:hyperlink r:id="rIdLP1"><w:r><w:rPr><w:color w:val="0563C1"/><w:sz w:val="18"/><w:u w:val="single"/></w:rPr><w:t xml:space="preserve">${esc(name)}</w:t></w:r></w:hyperlink></w:p>`:"";
  if(lpFolder)lpRels.push(`<Relationship Id="rIdLP1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${esc(relLink("..","Lesson Plans",`${code} - ${fileSafe(name)} - Lesson Plans.docx`))}" TargetMode="External"/>`);
  const run=(text,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}<w:sz w:val="${o.sz||18}"/></w:rPr><w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;
  const para=(text,o={})=>`<w:p><w:pPr><w:spacing w:after="40"/></w:pPr>${run(text,o)}</w:p>`;
  const bullets=items=>items.map(s=>para("• "+s)).join("");
  const cell=(w,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.span>1?`<w:gridSpan w:val="${o.span}"/>`:""}${o.vm?`<w:vMerge${o.vm==="restart"?' w:val="restart"':""}/>`:""}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}</w:tcPr>${o.body||para("")}</w:tc>`;
  const tr=cells=>`<w:tr>${cells.join("")}</w:tr>`;
  const table=(widths,rows)=>`<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b)}" w:type="dxa"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join("")}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${rows.join("")}</w:tbl>`;

  // Data for this unit
  const weeks=u.map(x=>({t:TERMS.find(T=>T.n===x.t),w:x.w,k:x.k,topic:(store[x.k]||"").trim(),isCat:x===u[u.length-1]}));
  const topics=weeks.map(x=>x.topic.replace(/^S[12]_\w+?:\s*/,"").replace(/^EXAM:\s*/,"")).filter(Boolean);
  const codes=[...new Set(weeks.flatMap(x=>(store["codes-"+x.k]||"").split(/[\s,;]+/).filter(Boolean)))];
  const lis=[],scs=[],dns=[],titles=[];
  let firstDn="";
  weeks.forEach(x=>lessonNames(x.t,x.w).forEach((ln,j)=>{
    const kk=`${x.t.n}-${x.w}-${j+1}`, f=s=>(store[`${kk}-${s}`]||"").trim();
    if(f("li"))lis.push(f("li"));
    f("sc").split(/\s*\|\s*/).filter(Boolean).forEach(s=>scs.push(s));
    if(f("dn"))dns.push(f("dn"));
    if(f("title"))titles.push(f("title"));
    if(!firstDn&&f("dn"))firstDn=f("dn");
  }));
  const uniq=a=>[...new Set(a)];
  const liU=uniq(lis), scU=uniq(scs);
  const cat=weeks[weeks.length-1];
  const UNIT_TEXT=[name,...topics,...titles,...liU,...scU].join(" ");
  const SUBS=[
    [/film|viewing|camels/i,"Analysing film","film language and camera techniques"],
    [/oral|present|debate|speech|rehears/i,"Speaking and presenting","spoken language and presentation"],
    [/memoir|creative|narrative|crafting|personal text/i,"Creating texts","creative and personal language"],
    [/grammar|conventions|punctuation|sentence/i,"Language conventions","language conventions and sentence structure"],
    [/macbeth|romeo|shakespeare|early modern/i,"Shakespearean drama","Shakespearean language and dramatic structure"],
    [/persua|argu|contention|analys|essay/i,"Analysing argument and texts","persuasive and analytical language"],
    [/animal farm|allegory|novel|fable/i,"Analysing novels","narrative voice and symbolism"]];
  const subHits=SUBS.filter(([re])=>re.test(UNIT_TEXT));
  const sub=subHits.length?[...new Set(subHits.map(x=>x[1]))].slice(0,2).join(", "):"Reading and responding to texts";
  const focusPhrase=subHits.length?subHits[0][2]:"text structure and language features";
  const opt=(re,yes)=>re.test(UNIT_TEXT)?yes:"";
  const adj={
    eal:`Pre-teach the key terms for ${(subHits.length?subHits[0][1]:"this unit").toLowerCase()} with a word bank and visual glossary. Give sentence starters for each learning intention. Students plan the ${ASSESS} in dot points before drafting.`+opt(/oral|present|debate|speech/i," Record a practice run so students hear the model before they speak."),
    int:`Break each lesson into numbered steps with a visual organiser. Give annotated copies of the texts with key quotes highlighted. For the ${ASSESS}, allow extra time, a dictated or recorded response and a shorter word target.`+opt(/film|viewing|camels/i," Re-watch film clips in short sections, with a CAMELS+D checklist."),
    ext:`Students write their own analytical question about the unit and test it against the success criteria. Add a comparison with a second text, or a counter-argument, to the CAT.`+opt(/oral|present|debate/i," Students answer audience questions after their presentation.")+opt(/film|viewing/i," Students compare two film clips using CAMELS+D.")
  };
  const std9=`By the end of Level 9, students analyse how ${focusPhrase} shape meaning for an audience. They use evidence from the text to support their interpretation and organise their ideas in clear, structured responses.`;
  const std10=`By the end of Level 10, students evaluate how ${focusPhrase} position the audience and shape meaning. They sustain a clear interpretation or argument using precise, selected evidence, and adapt language and structure to purpose and audience.`;
  const formText=`Checked in every lesson against the success criteria, with the Do Now as an entry check (Weeks 1–${weeks.length}).`;
  const catInfo=(store["info-"+cat.k]||"").trim();
  const strandCounts={};
  codes.forEach(c=>{const mm=c.match(/^VC2E\d+(LA|LE|LY)/); if(mm) strandCounts[mm[1]]=(strandCounts[mm[1]]||0)+1;});
  const STRAND={LA:"Language",LE:"Literature",LY:"Literacy"};
  const top=Object.entries(strandCounts).sort((a,b)=>b[1]-a[1])[0];
  const strand=top?STRAND[top[0]]:"to be added";
  const corpus=[name,...topics,...liU,...scU,...dns,...titles,catInfo].join(" ").toLowerCase();
  const tick=(on,label)=>para((on?"☒ ":"☐ ")+label);
  const cross=UP2_CROSS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const caps=UP2_CAPS.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const cld=UP2_CLD.map(([l,re])=>tick(re.test(corpus),l)).join("");
  const firstWeek=weeks[0];
  const preText=firstDn?`Week 1 Do Now (diagnostic): ${firstDn}`:`Diagnostic at the start of the unit: students write what they already know about "${topics[0]||name}" and one question they have.`;
  const catText=para(cat.topic||"To be added",{b:1})+(catInfo?bullets(catInfo.split("\n").filter(s=>s.trim()).map(s=>s.trim())):"");
  const W=[1421,1421,1421,2549,6045];

  const sec1=table([2850,5110,5110],[
    tr([cell(13070,{span:3,fill:"FFC0E3",body:para("Adjustments/ Scaffolds",{b:1})})]),
    tr([cell(2850,{body:para("EAL",{b:1})}),cell(5110,{body:para("Integration",{b:1})}),cell(5110,{body:para("Extension",{b:1})})]),
    tr([cell(2850,{body:para(adj.eal)}),cell(5110,{body:para(adj.int)}),cell(5110,{body:para(adj.ext)})])]);
  const sec2=table([6229,6821],[
    tr([cell(13050,{span:2,fill:"D9D9D9",body:para("Mapping to F–10 Victorian Curriculum 2.0",{b:1})})]),
    tr([cell(13050,{span:2,body:para("Content description: "+(codes.join(", ")||"to be added"))})]),
    tr([cell(13050,{span:2,fill:"D1E8B2",body:para("Achievement standard",{b:1})})]),
    tr([cell(6229,{body:para("Level 9",{b:1})}),cell(6821,{body:para("Level 9 and 10",{b:1})})]),
    tr([cell(6229,{body:para(std9)}),cell(6821,{body:para(std10)})])]);
  const sec3=table([3120,3120,6600],[
    tr([cell(12840,{span:3,fill:"C6ECFF",body:para(`${yearLevel} English: ${name}`,{b:1})})]),
    tr([cell(3120,{body:para("Strand: "+strand)}),cell(3120,{body:para("Sub-strand: "+sub)}),cell(6600,{body:para(`Recommended teaching time: ${u.length} weeks`)})])]);
  const catName=((cat.topic||"").split(":").slice(1).join(":")||cat.topic||name).trim();
  const euLI=`We will explore how ${focusPhrase} shape meaning, and apply this in ${catName}.`;
  const euSC=`I can use evidence from the text to explain how ${focusPhrase} shape meaning, and structure this in ${catName}.`;
  const eu=para("Learning Intention:",{b:1})+para(euLI)+para("Success Criteria:",{b:1})+para(euSC);
  const bigRows=[
    tr([cell(4263,{fill:"D1E8B2",body:para("The Big Question / Idea",{b:1})}),cell(8594,{fill:"D1E8B2",body:para("Essential Understandings",{b:1})})]),
    tr([cell(4263,{body:para(name,{b:1})+para("What students do in this unit:",{b:1})+bullets(topics)}),cell(8594,{vm:"restart",body:eu})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Cross Curricular Priorities",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:cross}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{fill:"D1E8B2",body:para("Capabilities curriculum",{b:1})}),cell(8594,{vm:"continue"})]),
    tr([cell(4263,{body:caps}),cell(8594,{vm:"continue"})])];
  const sec4=table([4263,8594],bigRows);
  const sec5=table(W,[
    tr([cell(4263,{span:3,fill:"D1E8B2",body:para("Common Assessments",{b:1})}),cell(8594,{span:2,fill:"D1E8B2",body:para("21CLD",{b:1})})]),
    tr([cell(W[0],{body:para("Pre-assessment",{b:1})+para(preText)}),
        cell(W[1],{body:para("Formative (ongoing)",{b:1})+para(formText)}),
        cell(W[2],{body:para("Summative (final)",{b:1})+catText}),
        cell(W[3],{body:cld}),
        cell(W[4],{})])]);

  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>', R="http://schemas.openxmlformats.org/officeDocument/2006/relationships", CT="application/vnd.openxmlformats-officedocument.wordprocessingml.";
  const body=para(`English · ${yearLevel} · ${name}`,{b:1,sz:24})+lpLine+sec1+para("")+sec2+para("")+sec3+para("")+sec4+para("")+sec5+para("");
  return zip({
    "[Content_Types].xml":X+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="${CT}document.main+xml"/><Override PartName="/word/styles.xml" ContentType="${CT}styles+xml"/></Types>`,
    "_rels/.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="word/document.xml"/></Relationships>`,
    "word/_rels/document.xml.rels":X+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/styles" Target="styles.xml"/>${lpRels.join("")}</Relationships>`,
    "word/styles.xml":X+`<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Aptos" w:hAnsi="Aptos" w:eastAsia="Aptos" w:cs="Aptos"/><w:sz w:val="18"/><w:szCs w:val="18"/><w:lang w:val="en-AU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>`,
    "word/document.xml":X+`<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`
  });
}
document.getElementById("upv2btn").onclick=()=>{
  const us=units(), dl=document.createElement("dialog");dl.className="units";dl.setAttribute("aria-labelledby","up2h");
  dl.innerHTML=`<h2 id="up2h">Unit plans</h2><p>Each unit runs from its first lesson to its CAT.</p>`+

    `<form method="dialog"><button class="btn">Close</button></form>`;
  dl.addEventListener("click",e=>{
    if(e.target===dl)return dl.close();
